# Coste variable de energía de la vivienda y de cada dispositivo, sin imputar
# autoconsumo solar ni conceptos fijos de la factura. El precio de compra debe
# estar en €/kWh. El total usa la potencia de consumo de la vivienda completa.

recorder:
  include:
    entities:
      - sensor.salon_principal_coste_instantaneo
      - sensor.comedor_principal_coste_instantaneo
      - sensor.suite_principal_coste_instantaneo
      - sensor.escalera_principal_coste_instantaneo
      - sensor.piscina_motor_coste_instantaneo
      - sensor.coladuria_cargador_ev_coste_instantaneo
      - sensor.climatizacion_planta_baja_aire_acondicionado_coste_instantaneo
      - sensor.climatizacion_primera_planta_aire_acondicionado_coste_instantaneo
      - sensor.salon_regleta_coste_instantaneo
      - sensor.cocina_nevera_coste_instantaneo
      - sensor.cocina_congelador_coste_instantaneo
      - sensor.coladuria_secadora_coste_instantaneo
      - sensor.cocina_lavavajillas_coste_instantaneo
      - sensor.coladuria_lavadora_coste_instantaneo
      - sensor.salon_principal_coste_acumulado
      - sensor.comedor_principal_coste_acumulado
      - sensor.suite_principal_coste_acumulado
      - sensor.escalera_principal_coste_acumulado
      - sensor.piscina_motor_coste_acumulado
      - sensor.coladuria_cargador_ev_coste_acumulado
      - sensor.climatizacion_planta_baja_aire_acondicionado_coste_acumulado
      - sensor.climatizacion_primera_planta_aire_acondicionado_coste_acumulado
      - sensor.salon_regleta_coste_acumulado
      - sensor.cocina_nevera_coste_acumulado
      - sensor.cocina_congelador_coste_acumulado
      - sensor.coladuria_secadora_coste_acumulado
      - sensor.cocina_lavavajillas_coste_acumulado
      - sensor.coladuria_lavadora_coste_acumulado
      - sensor.energia_coste_casa_instantaneo
      - sensor.energia_coste_casa_acumulado
      - sensor.salon_principal_coste_mensual
      - sensor.comedor_principal_coste_mensual
      - sensor.suite_principal_coste_mensual
      - sensor.escalera_principal_coste_mensual
      - sensor.piscina_motor_coste_mensual
      - sensor.coladuria_cargador_ev_coste_mensual
      - sensor.climatizacion_planta_baja_aire_acondicionado_coste_mensual
      - sensor.climatizacion_primera_planta_aire_acondicionado_coste_mensual
      - sensor.salon_regleta_coste_mensual
      - sensor.cocina_nevera_coste_mensual
      - sensor.cocina_congelador_coste_mensual
      - sensor.coladuria_secadora_coste_mensual
      - sensor.cocina_lavavajillas_coste_mensual
      - sensor.coladuria_lavadora_coste_mensual
      - sensor.energia_coste_casa_mensual

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.energy_price_buy
          - sensor.energy_power_house
          - sensor.salon_principal_potencia
          - sensor.comedor_principal_potencia
          - sensor.suite_principal_potencia
          - sensor.escalera_principal_potencia
          - sensor.piscina_power
          - sensor.coladuria_cargador_ev_potencia
          - sensor.aire_acondicionado_planta_baja_potencia
          - sensor.aire_acondicionado_primera_planta_potencia
          - sensor.salon_regleta_potencia_filtrada
          - sensor.cocina_nevera_potencia
          - sensor.cocina_congelador_potencia
          - sensor.coladuria_secadora_potencia
          - sensor.cocina_lavavajillas_potencia
          - sensor.coladuria_lavadora_potencia
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: Energia coste casa instantaneo
        unique_id: energia_coste_casa_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.energy_power_house') }}"
        state: "{{ (states('sensor.energy_power_house') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Salon principal coste instantaneo
        unique_id: salon_principal_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.salon_principal_potencia') }}"
        state: "{{ (states('sensor.salon_principal_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Comedor principal coste instantaneo
        unique_id: comedor_principal_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.comedor_principal_potencia') }}"
        state: "{{ (states('sensor.comedor_principal_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Suite principal coste instantaneo
        unique_id: suite_principal_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.suite_principal_potencia') }}"
        state: "{{ (states('sensor.suite_principal_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Escalera principal coste instantaneo
        unique_id: escalera_principal_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.escalera_principal_potencia') }}"
        state: "{{ (states('sensor.escalera_principal_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Piscina motor coste instantaneo
        unique_id: piscina_motor_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.piscina_power') }}"
        state: "{{ (states('sensor.piscina_power') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Coladuria cargador ev coste instantaneo
        unique_id: coladuria_cargador_ev_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.coladuria_cargador_ev_potencia') }}"
        state: "{{ (states('sensor.coladuria_cargador_ev_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Climatizacion planta baja aire acondicionado coste instantaneo
        unique_id: climatizacion_planta_baja_aire_acondicionado_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.aire_acondicionado_planta_baja_potencia') }}"
        state: "{{ (states('sensor.aire_acondicionado_planta_baja_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Climatizacion primera planta aire acondicionado coste instantaneo
        unique_id: climatizacion_primera_planta_aire_acondicionado_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.aire_acondicionado_primera_planta_potencia') }}"
        state: "{{ (states('sensor.aire_acondicionado_primera_planta_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Salon regleta coste instantaneo
        unique_id: salon_regleta_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.salon_regleta_potencia_filtrada') }}"
        state: "{{ (states('sensor.salon_regleta_potencia_filtrada') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Cocina nevera coste instantaneo
        unique_id: cocina_nevera_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.cocina_nevera_potencia') }}"
        state: "{{ (states('sensor.cocina_nevera_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Cocina congelador coste instantaneo
        unique_id: cocina_congelador_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.cocina_congelador_potencia') }}"
        state: "{{ (states('sensor.cocina_congelador_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Coladuria secadora coste instantaneo
        unique_id: coladuria_secadora_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.coladuria_secadora_potencia') }}"
        state: "{{ (states('sensor.coladuria_secadora_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Cocina lavavajillas coste instantaneo
        unique_id: cocina_lavavajillas_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.cocina_lavavajillas_potencia') }}"
        state: "{{ (states('sensor.cocina_lavavajillas_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

      - name: Coladuria lavadora coste instantaneo
        unique_id: coladuria_lavadora_coste_instantaneo
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: "{{ has_value('sensor.energy_price_buy') and has_value('sensor.coladuria_lavadora_potencia') }}"
        state: "{{ (states('sensor.coladuria_lavadora_potencia') | float(0) / 1000 * states('sensor.energy_price_buy') | float(0)) | round(6) }}"

  - sensor:
      - name: Energia coste mensual maximo dispositivo
        unique_id: energia_coste_mensual_maximo_dispositivo
        unit_of_measurement: "€"
        state_class: measurement
        state: >
          {{ [
            0.01,
            states('sensor.salon_principal_coste_mensual') | float(0),
            states('sensor.comedor_principal_coste_mensual') | float(0),
            states('sensor.suite_principal_coste_mensual') | float(0),
            states('sensor.escalera_principal_coste_mensual') | float(0),
            states('sensor.piscina_motor_coste_mensual') | float(0),
            states('sensor.coladuria_cargador_ev_coste_mensual') | float(0),
            states('sensor.climatizacion_planta_baja_aire_acondicionado_coste_mensual') | float(0),
            states('sensor.climatizacion_primera_planta_aire_acondicionado_coste_mensual') | float(0),
            states('sensor.salon_regleta_coste_mensual') | float(0),
            states('sensor.cocina_nevera_coste_mensual') | float(0),
            states('sensor.cocina_congelador_coste_mensual') | float(0),
            states('sensor.coladuria_secadora_coste_mensual') | float(0),
            states('sensor.cocina_lavavajillas_coste_mensual') | float(0),
            states('sensor.coladuria_lavadora_coste_mensual') | float(0)
          ] | max }}

