# Environmental sensors, aggregated temperatures, and sleep modes.
recorder:
  include:
    entities:
      - input_boolean.sleep_mode
      - input_boolean.bed_occupancy_jordi
      - sensor.exterior_temperature
      - sensor.exterior_humidity
      - sensor.pluviometro_rain
      - sensor.anemometro_wind_strength
      - sensor.salon_temperature
      - sensor.salon_humidity
      - sensor.salon_noise
      - sensor.salon_pressure
      - sensor.salon_co2
      - sensor.home_temperature
      - sensor.ground_floor_temperature
      - sensor.first_floor_temperature
      - sensor.suite_temperature
      - sensor.suite_co2
      - sensor.suite_humidity
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_carlos_co2
      - sensor.habitacion_carlos_humidity
      - sensor.habitacion_coque_temperature
      - sensor.habitacion_coque_co2
      - sensor.habitacion_coque_humidity
      - sensor.recibidor_termostato_temperatura
      - sensor.recibidor_termostato_temperatura_objetivo
      - binary_sensor.recibidor_termostato_activo
      - sensor.despacho_movimiento_iluminancia
      - sensor.despacho_movimiento_temperatura
      - sensor.cocina_puerta_porche_temperatura

logbook:
  exclude:
    entities:
      - sensor.exterior_temperature
      - sensor.exterior_humidity
      - sensor.pluviometro_rain
      - sensor.anemometro_wind_strength
      - sensor.salon_temperature
      - sensor.salon_humidity
      - sensor.salon_noise
      - sensor.salon_pressure
      - sensor.salon_co2
      - sensor.home_temperature
      - sensor.ground_floor_temperature
      - sensor.first_floor_temperature
      - sensor.suite_temperature
      - sensor.suite_co2
      - sensor.suite_humidity
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_carlos_co2
      - sensor.habitacion_carlos_humidity
      - sensor.habitacion_coque_temperature
      - sensor.habitacion_coque_co2
      - sensor.habitacion_coque_humidity
      - sensor.recibidor_termostato_temperatura
      - sensor.despacho_movimiento_iluminancia
      - sensor.despacho_movimiento_temperatura
      - sensor.cocina_puerta_porche_temperatura
template:
  - binary_sensor:
    # Estimate heat demand; this does not confirm the boiler's actual operation.
    - name: recibidor_termostato_activo
      unique_id: recibidor_termostato_activo
      device_class: heat
      availability: >-
        {{ is_state('climate.recibidor_termostato', 'off')
           or (is_state('climate.recibidor_termostato', 'heat')
               and is_number(states('sensor.recibidor_termostato_temperatura'))
               and is_number(states('sensor.recibidor_termostato_temperatura_objetivo'))) }}
      state: >-
        {% set current = states('sensor.recibidor_termostato_temperatura') %}
        {% set target = states('sensor.recibidor_termostato_temperatura_objetivo') %}
        {{ is_state('climate.recibidor_termostato', 'heat')
           and is_number(current) and is_number(target)
           and current | float(0) < target | float(0) }}
      attributes:
        estimado: true

    - name: summer_time
      device_class: light
      state: '{{ as_timestamp(strptime(states.sensor.date_time.state, "%Y-%m-%d, %H:%M"))|timestamp_custom("%Z") == "CEST"}}'

  - weather:
    - name: "Casa"
      unique_id: "casa"
      condition_template: "{{ states('weather.aemet') }}"
      temperature_template: "{{ states('sensor.exterior_temperature') | float }}"
      temperature_unit: "°C"
      humidity_template: "{{ states('sensor.exterior_humidity') | float }}"
      forecast_daily_template: "{{ state_attr('weather.aemet', 'forecast') }}"
      pressure_template: "{{ states('sensor.salon_pressure') | float }}"
      pressure_unit: "hPa"
      #wind_speed_template: ""
      #wind_gust_speed_template: ""
      #wind_speed_unit: ""
      #wind_bearing_template: ""

  - sensor:
    # Sensors to get sunset and sunrise hours with a custom format.
    - name: sunrise
      state: '{{ as_timestamp(states.sun.sun.attributes.next_rising)|timestamp_custom("%H:%M:%S") }}'
    - name: sunset
      state: '{{ as_timestamp(states.sun.sun.attributes.next_setting)|timestamp_custom("%H:%M:%S") }}'
    # Thermostat sensors
    - name: recibidor_termostato_temperatura_objetivo
      unique_id: recibidor_termostato_temperatura_objetivo
      device_class: temperature
      unit_of_measurement: "°C"
      state: "{{ state_attr('climate.recibidor_termostato', 'temperature') }}"
      availability: >
        {{ state_attr('climate.recibidor_termostato', 'temperature') is not none }}

sensor:
  # Average temperatures by floor, for the whole home, and over the last 24 hours
  - platform: min_max
    name: ground_floor_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.recibidor_termostato_temperatura
      - sensor.salon_temperature
      - sensor.despacho_movimiento_temperatura

  - platform: min_max
    name: first_floor_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.suite_temperature
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_coque_temperature

  - platform: min_max
    name: home_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.suite_temperature
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_coque_temperature
      - sensor.salon_temperature
      - sensor.recibidor_termostato_temperatura
      - sensor.despacho_movimiento_temperatura

  - platform: statistics
    name: home_temperature_stats
    state_characteristic: mean
    entity_id: sensor.home_temperature
    sampling_size: 1440
    max_age:
      hours: 24

input_boolean:
  # Seasonal permission, independent of occupancy and actual thermostat mode.
  # No initial value: restore the previous state (off on first installation).
  calefaccion_temporada_activo:
    name: Calefacción habilitada
    icon: "mdi:radiator"
  sleep_mode:
    name: Modo dormir
    icon: "mdi:sleep"
  bed_occupancy_jordi:
    name: Jordi en la cama
    icon: "mdi:bed"
