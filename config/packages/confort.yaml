# Sensores ambientales, temperaturas agregadas y modos de descanso.
recorder:
  include:
    entities:
      - input_boolean.sleep_mode
      - input_boolean.bed_occupancy_jordi
      - sensor.exterior_temperature
      - sensor.exterior_humidity
      - sensor.pluviometro_rain
      - sensor.anemometro_wind_strength
      - sensor.salon_temperature
      - sensor.salon_humidity
      - sensor.salon_noise
      - sensor.salon_pressure
      - sensor.salon_co2
      - sensor.home_temperature
      - sensor.ground_floor_temperature
      - sensor.first_floor_temperature
      - sensor.suite_temperature
      - sensor.suite_co2
      - sensor.suite_humidity
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_carlos_co2
      - sensor.habitacion_carlos_humidity
      - sensor.habitacion_coque_temperature
      - sensor.habitacion_coque_co2
      - sensor.habitacion_coque_humidity
      - sensor.recibidor_temperature
      - sensor.despacho_movimiento_iluminancia
      - sensor.despacho_movimiento_temperatura
      - sensor.recibidor_target_temperature
      - sensor.cocina_puerta_porche_temperatura

logbook:
  exclude:
    entities:
      - sensor.exterior_temperature
      - sensor.exterior_humidity
      - sensor.pluviometro_rain
      - sensor.anemometro_wind_strength
      - sensor.salon_temperature
      - sensor.salon_humidity
      - sensor.salon_noise
      - sensor.salon_pressure
      - sensor.salon_co2
      - sensor.home_temperature
      - sensor.ground_floor_temperature
      - sensor.first_floor_temperature
      - sensor.suite_temperature
      - sensor.suite_co2
      - sensor.suite_humidity
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_carlos_co2
      - sensor.habitacion_carlos_humidity
      - sensor.habitacion_coque_temperature
      - sensor.habitacion_coque_co2
      - sensor.habitacion_coque_humidity
      - sensor.recibidor_temperature
      - sensor.despacho_movimiento_iluminancia
      - sensor.despacho_movimiento_temperatura
      - sensor.cocina_puerta_porche_temperatura
template:
  - binary_sensor:
    - name: summer_time
      device_class: light
      state: '{{ as_timestamp(strptime(states.sensor.date_time.state, "%Y-%m-%d, %H:%M"))|timestamp_custom("%Z") == "CEST"}}'

  - weather:
    - name: "Casa"
      unique_id: "casa"
      condition_template: "{{ states('weather.aemet') }}"
      temperature_template: "{{ states('sensor.exterior_temperature') | float }}"
      temperature_unit: "°C"
      humidity_template: "{{ states('sensor.exterior_humidity') | float }}"
      forecast_daily_template: "{{ state_attr('weather.aemet', 'forecast') }}"
      pressure_template: "{{ states('sensor.salon_pressure') | float }}"
      pressure_unit: "hPa"
      #wind_speed_template: ""
      #wind_gust_speed_template: ""
      #wind_speed_unit: ""
      #wind_bearing_template: ""

  - sensor:
    # Sensors to get sunset and sunrise hours with a custom format.
    - name: sunrise
      state: '{{ as_timestamp(states.sun.sun.attributes.next_rising)|timestamp_custom("%H:%M:%S") }}'
    - name: sunset
      state: '{{ as_timestamp(states.sun.sun.attributes.next_setting)|timestamp_custom("%H:%M:%S") }}'
    # Thermostat sensors
    - name: recibidor_target_temperature
      state: "{{state_attr('climate.recibidor', 'temperature')}}"
    - name: recibidor_temperature
      state: "{{state_attr('climate.recibidor', 'current_temperature')}}"

sensor:
  # Temperaturas medias por planta, de la casa y de las ultimas 24 horas
  - platform: min_max
    name: ground_floor_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.recibidor_temperature
      - sensor.salon_temperature
      - sensor.despacho_movimiento_temperatura

  - platform: min_max
    name: first_floor_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.suite_temperature
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_coque_temperature

  - platform: min_max
    name: home_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.suite_temperature
      - sensor.habitacion_carlos_temperature
      - sensor.habitacion_coque_temperature
      - sensor.salon_temperature
      - sensor.recibidor_temperature
      - sensor.despacho_movimiento_temperatura

  - platform: statistics
    name: home_temperature_stats
    state_characteristic: mean
    entity_id: sensor.home_temperature
    sampling_size: 1440
    max_age:
      hours: 24

input_boolean:
  sleep_mode:
    name: Modo dormir
    icon: "mdi:sleep"
  bed_occupancy_jordi:
    name: Jordi en la cama
    icon: "mdi:bed"
