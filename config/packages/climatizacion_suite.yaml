###############################################################################
# RECORDER
###############################################################################

recorder:
  include:
    entities:
      - binary_sensor.suite_temperatura_bajando
      - binary_sensor.habitacion_carlos_temperatura_bajando
      - binary_sensor.habitacion_coque_temperatura_bajando
      - binary_sensor.suite_aire_acondicionado_enfriando
      - binary_sensor.habitacion_carlos_aire_acondicionado_enfriando
      - binary_sensor.habitacion_coque_aire_acondicionado_enfriando
      - binary_sensor.suite_aire_acondicionado_parado_sin_consigna
      - binary_sensor.suite_aire_acondicionado_compitiendo
      - input_boolean.suite_aire_acondicionado_prueba_activa
      - input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno
      - input_boolean.suite_aire_acondicionado_previsto
      - input_boolean.habitacion_carlos_aire_acondicionado_previsto
      - input_boolean.habitacion_coque_aire_acondicionado_previsto
      - counter.suite_aire_acondicionado_fallos_nocturnos
      - input_datetime.suite_aire_acondicionado_inicio_actividad
      - input_datetime.suite_aire_acondicionado_inicio_enfriamiento
      - input_datetime.suite_aire_acondicionado_fin_enfriamiento
      - input_datetime.suite_aire_acondicionado_inicio_parada
      - input_datetime.suite_aire_acondicionado_fin_parada
      - input_number.suite_aire_acondicionado_temperatura_consigna
      - input_number.suite_aire_acondicionado_margen_consigna
      - input_number.suite_aire_acondicionado_temperatura_inicio_enfriamiento
      - input_number.suite_aire_acondicionado_temperatura_fin_enfriamiento
      - input_number.suite_aire_acondicionado_temperatura_inicio_parada
      - input_number.suite_aire_acondicionado_potencia_inicio_parada
      - input_number.suite_aire_acondicionado_potencia_media_30min_inicio_parada
      - input_number.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo
      - input_number.suite_aire_acondicionado_tiempo_enfriamiento_ultimo
      - input_number.suite_aire_acondicionado_tiempo_parada_ultimo
      - sensor.suite_aire_acondicionado_potencia_media_30min
      - sensor.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo
      - sensor.suite_aire_acondicionado_tiempo_enfriamiento_actual
      - sensor.suite_aire_acondicionado_tiempo_enfriamiento_ultimo
      - sensor.suite_aire_acondicionado_tiempo_parada_actual
      - sensor.suite_aire_acondicionado_tiempo_parada_ultimo
      - sensor.suite_aire_acondicionado_descenso_enfriamiento_ultimo
      - sensor.suite_aire_acondicionado_diferencia_consigna
      - sensor.climatizacion_primera_planta_aire_acondicionado_splits_enfriando
      - sensor.climatizacion_primera_planta_aire_acondicionado_otros_splits_enfriando

###############################################################################
# SENSORES
###############################################################################

sensor:
  # Media movil de la potencia total del A/A de primera planta en los ultimos
  # 30 minutos. No mide la Suite individualmente; mide el conjunto exterior/1P.
  - platform: statistics
    name: "Suite aire acondicionado potencia media 30min"
    unique_id: suite_aire_acondicionado_potencia_media_30min
    entity_id: sensor.climatizacion_primera_planta_aire_acondicionado_potencia
    state_characteristic: mean
    sampling_size: 240
    max_age:
      minutes: 30

binary_sensor:
  - platform: trend
    sensors:
      # Detecta si la temperatura de la Suite tiene tendencia descendente en
      # los ultimos 30 minutos. Es una inferencia de enfriamiento, no una lectura
      # directa del split.
      suite_temperatura_bajando:
        entity_id: sensor.suite_temperature
        unique_id: suite_temperatura_bajando
        sample_duration: 1800
        max_samples: 30
        min_samples: 4
        min_gradient: 0.0000833333
        invert: true
        device_class: cold

      # Detecta si la temperatura de Carlos tiene tendencia descendente en los
      # ultimos 30 minutos. Es una inferencia, no una lectura directa del split.
      habitacion_carlos_temperatura_bajando:
        entity_id: sensor.habitacion_carlos_temperature
        unique_id: habitacion_carlos_temperatura_bajando
        sample_duration: 1800
        max_samples: 30
        min_samples: 4
        min_gradient: 0.0000833333
        invert: true
        device_class: cold

      # Detecta si la temperatura de Coque tiene tendencia descendente en los
      # ultimos 30 minutos. Puede dar falsos positivos si la habitacion se enfria
      # por arrastre o por condiciones externas.
      habitacion_coque_temperatura_bajando:
        entity_id: sensor.habitacion_coque_temperature
        unique_id: habitacion_coque_temperatura_bajando
        sample_duration: 1800
        max_samples: 30
        min_samples: 4
        min_gradient: 0.0000833333
        invert: true
        device_class: cold

template:
  - binary_sensor:
      # Indica que la Suite esta enfriando de forma inferida: prueba activa,
      # split Suite previsto, A/A 1P consumiendo y temperatura de Suite bajando.
      - name: "Suite aire acondicionado enfriando"
        unique_id: suite_aire_acondicionado_enfriando
        availability: >-
          {{
            has_value('sensor.suite_temperature')
            and has_value('sensor.climatizacion_primera_planta_aire_acondicionado_potencia')
          }}
        state: >-
          {{
            is_state('input_boolean.suite_aire_acondicionado_prueba_activa', 'on')
            and is_state('input_boolean.suite_aire_acondicionado_previsto', 'on')
            and is_state('binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo', 'on')
            and is_state('binary_sensor.suite_temperatura_bajando', 'on')
          }}
        icon: mdi:snowflake

      # Indica que Carlos esta enfriando de forma inferida: split Carlos
      # previsto, A/A 1P consumiendo y temperatura de Carlos bajando.
      - name: "Habitacion Carlos aire acondicionado enfriando"
        unique_id: habitacion_carlos_aire_acondicionado_enfriando
        availability: >-
          {{
            has_value('sensor.habitacion_carlos_temperature')
            and has_value('sensor.climatizacion_primera_planta_aire_acondicionado_potencia')
          }}
        state: >-
          {{
            is_state('input_boolean.habitacion_carlos_aire_acondicionado_previsto', 'on')
            and
            is_state('binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo', 'on')
            and is_state('binary_sensor.habitacion_carlos_temperatura_bajando', 'on')
          }}
        icon: mdi:snowflake

      # Indica que Coque esta enfriando de forma inferida: split Coque previsto,
      # A/A 1P consumiendo y temperatura de Coque bajando. No confirma que el
      # split este encendido.
      - name: "Habitacion Coque aire acondicionado enfriando"
        unique_id: habitacion_coque_aire_acondicionado_enfriando
        availability: >-
          {{
            has_value('sensor.habitacion_coque_temperature')
            and has_value('sensor.climatizacion_primera_planta_aire_acondicionado_potencia')
          }}
        state: >-
          {{
            is_state('input_boolean.habitacion_coque_aire_acondicionado_previsto', 'on')
            and
            is_state('binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo', 'on')
            and is_state('binary_sensor.habitacion_coque_temperatura_bajando', 'on')
          }}
        icon: mdi:snowflake

      # Caso principal de fallo: la Suite esta por encima de consigna+margen,
      # el A/A 1P esta activo, pero la temperatura de Suite no baja durante 10 min.
      - name: "Suite aire acondicionado sin enfriar sobre consigna"
        unique_id: suite_aire_acondicionado_parado_sin_consigna
        availability: >-
          {{
            has_value('sensor.suite_temperature')
            and has_value('input_number.suite_aire_acondicionado_temperatura_consigna')
            and has_value('input_number.suite_aire_acondicionado_margen_consigna')
            and has_value('sensor.climatizacion_primera_planta_aire_acondicionado_potencia')
          }}
        state: >-
          {% set temperatura = states('sensor.suite_temperature') | float(0) %}
          {% set consigna = states('input_number.suite_aire_acondicionado_temperatura_consigna') | float(0) %}
          {% set margen = states('input_number.suite_aire_acondicionado_margen_consigna') | float(0) %}
          {{
            is_state('input_boolean.suite_aire_acondicionado_prueba_activa', 'on')
            and is_state('binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo', 'on')
            and is_state('binary_sensor.suite_temperatura_bajando', 'off')
            and temperatura > (consigna + margen)
          }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"
        icon: mdi:snowflake-alert

      # Marca que el fallo de Suite ocurre mientras al menos otro split previsto
      # parece estar enfriando. Es una senal de posible reparto/control, no una
      # prueba definitiva.
      - name: "Suite aire acondicionado compitiendo"
        unique_id: suite_aire_acondicionado_compitiendo
        availability: >-
          {{
            has_value('binary_sensor.suite_aire_acondicionado_parado_sin_consigna')
            and has_value('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando')
            and has_value('binary_sensor.habitacion_coque_aire_acondicionado_enfriando')
          }}
        state: >-
          {{
            is_state('binary_sensor.suite_aire_acondicionado_parado_sin_consigna', 'on')
            and (
              is_state('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando', 'on')
              or is_state('binary_sensor.habitacion_coque_aire_acondicionado_enfriando', 'on')
            )
          }}
        icon: mdi:call-split

  - sensor:
      # Diferencia entre la temperatura real de Suite y la consigna manual
      # introducida en el dashboard.
      - name: "Suite aire acondicionado diferencia consigna"
        unique_id: suite_aire_acondicionado_diferencia_consigna
        state: >-
          {% set temperatura = states('sensor.suite_temperature') | float(0) %}
          {% set consigna = states('input_number.suite_aire_acondicionado_temperatura_consigna') | float(0) %}
          {{ (temperatura - consigna) | round(1) }}
        availability: >-
          {{
            has_value('sensor.suite_temperature')
            and has_value('input_number.suite_aire_acondicionado_temperatura_consigna')
          }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-alert

      # Numero total de splits previstos de primera planta que parecen estar
      # enfriando segun la inferencia por tendencia de temperatura.
      - name: "Climatización primera planta aire acondicionado splits enfriando"
        unique_id: climatizacion_primera_planta_aire_acondicionado_splits_enfriando
        state: >-
          {{
            [
              is_state('binary_sensor.suite_aire_acondicionado_enfriando', 'on'),
              is_state('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando', 'on'),
              is_state('binary_sensor.habitacion_coque_aire_acondicionado_enfriando', 'on')
            ] | select('eq', true) | list | count
          }}
        availability: >-
          {{
            has_value('binary_sensor.suite_aire_acondicionado_enfriando')
            and has_value('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando')
            and has_value('binary_sensor.habitacion_coque_aire_acondicionado_enfriando')
          }}
        state_class: measurement
        icon: mdi:snowflake-variant

      # Numero de splits previstos distintos de Suite que parecen estar enfriando
      # segun la inferencia por tendencia de temperatura.
      - name: "Climatización primera planta aire acondicionado otros splits enfriando"
        unique_id: climatizacion_primera_planta_aire_acondicionado_otros_splits_enfriando
        state: >-
          {{
            [
              is_state('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando', 'on'),
              is_state('binary_sensor.habitacion_coque_aire_acondicionado_enfriando', 'on')
            ] | select('eq', true) | list | count
          }}
        availability: >-
          {{
            has_value('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando')
            and has_value('binary_sensor.habitacion_coque_aire_acondicionado_enfriando')
          }}
        state_class: measurement
        icon: mdi:call-split

      # Minutos que lleva la Suite enfriando en el episodio actual, desde el
      # ultimo encendido inferido de "Suite A/A enfriando".
      - name: "Suite aire acondicionado tiempo enfriamiento actual"
        unique_id: suite_aire_acondicionado_tiempo_enfriamiento_actual
        state: >-
          {% if is_state('binary_sensor.suite_aire_acondicionado_enfriando', 'on') %}
            {% set inicio = as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_enfriamiento'), 0) %}
            {{ ((as_timestamp(now()) - inicio) / 60) | round(0) if inicio > 0 else 0 }}
          {% else %}
            0
          {% endif %}
        availability: "{{ has_value('input_datetime.suite_aire_acondicionado_inicio_enfriamiento') }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand

      # Minutos transcurridos entre el inicio de actividad del A/A 1P y el
      # ultimo fallo confirmado de Suite.
      - name: "Suite aire acondicionado tiempo actividad hasta fallo ultimo"
        unique_id: suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo
        state: "{{ states('input_number.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo') | int(0) }}"
        availability: "{{ has_value('input_number.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo') }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-alert-outline

      # Minutos transcurridos entre el inicio inferido de enfriamiento de Suite
      # y el ultimo fallo confirmado.
      - name: "Suite aire acondicionado tiempo enfriamiento ultimo"
        unique_id: suite_aire_acondicionado_tiempo_enfriamiento_ultimo
        state: "{{ states('input_number.suite_aire_acondicionado_tiempo_enfriamiento_ultimo') | int(0) }}"
        availability: "{{ has_value('input_number.suite_aire_acondicionado_tiempo_enfriamiento_ultimo') }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-check

      # Minutos que lleva activo el fallo actual: Suite por encima de consigna
      # y sin bajar temperatura.
      - name: "Suite aire acondicionado tiempo sin enfriar sobre consigna actual"
        unique_id: suite_aire_acondicionado_tiempo_parada_actual
        state: >-
          {% if is_state('binary_sensor.suite_aire_acondicionado_parado_sin_consigna', 'on') %}
            {% set inicio = as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_parada'), 0) %}
            {{ ((as_timestamp(now()) - inicio) / 60) | round(0) if inicio > 0 else 0 }}
          {% else %}
            0
          {% endif %}
        availability: "{{ has_value('input_datetime.suite_aire_acondicionado_inicio_parada') }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-alert

      # Duracion del ultimo episodio confirmado en el que Suite estuvo por
      # encima de consigna y sin bajar temperatura.
      - name: "Suite aire acondicionado tiempo sin enfriar sobre consigna ultimo"
        unique_id: suite_aire_acondicionado_tiempo_parada_ultimo
        state: "{{ states('input_number.suite_aire_acondicionado_tiempo_parada_ultimo') | int(0) }}"
        availability: "{{ has_value('input_number.suite_aire_acondicionado_tiempo_parada_ultimo') }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-check-outline

      # Grados que consiguio bajar la Suite entre el inicio inferido de
      # enfriamiento y el momento en que se confirmo el fallo.
      - name: "Suite aire acondicionado descenso enfriamiento ultimo"
        unique_id: suite_aire_acondicionado_descenso_enfriamiento_ultimo
        state: >-
          {% set inicio = states('input_number.suite_aire_acondicionado_temperatura_inicio_enfriamiento') | float(0) %}
          {% set fin = states('input_number.suite_aire_acondicionado_temperatura_fin_enfriamiento') | float(0) %}
          {{ (inicio - fin) | round(1) }}
        availability: >-
          {{
            has_value('input_number.suite_aire_acondicionado_temperatura_inicio_enfriamiento')
            and has_value('input_number.suite_aire_acondicionado_temperatura_fin_enfriamiento')
          }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-chevron-down

###############################################################################
# AYUDANTES
###############################################################################

input_boolean:
  # Activa o desactiva la ventana de diagnostico de la Suite.
  suite_aire_acondicionado_prueba_activa:
    name: "Prueba A/A suite activa"
    icon: mdi:clipboard-check-outline

  # Indica si durante la noche se ha detectado al menos una vez que Suite
  # empezaba a enfriar.
  suite_aire_acondicionado_enfriamiento_detectado_nocturno:
    name: "A/A suite enfriando detectado esta noche"
    icon: mdi:snowflake-check

  # Marca manualmente si se espera que el split de Suite este encendido durante
  # la prueba nocturna.
  suite_aire_acondicionado_previsto:
    name: "A/A suite previsto esta noche"
    icon: mdi:snowflake

  # Marca manualmente si se espera que el split de Carlos este encendido durante
  # la prueba nocturna. Si esta apagado, Carlos no cuenta como competidor aunque
  # su temperatura baje.
  habitacion_carlos_aire_acondicionado_previsto:
    name: "A/A Carlos previsto esta noche"
    icon: mdi:snowflake

  # Marca manualmente si se espera que el split de Coque este encendido durante
  # la prueba nocturna. Si esta apagado, Coque no cuenta como competidor aunque
  # su temperatura baje.
  habitacion_coque_aire_acondicionado_previsto:
    name: "A/A Coque previsto esta noche"
    icon: mdi:snowflake

counter:
  # Cuenta los fallos confirmados durante la ventana nocturna actual.
  suite_aire_acondicionado_fallos_nocturnos:
    name: "Fallos nocturnos A/A suite"
    icon: mdi:snowflake-alert
    restore: true

input_datetime:
  # Hora en la que el A/A de primera planta pasa a estar activo durante la
  # ventana de prueba.
  suite_aire_acondicionado_inicio_actividad:
    name: "Inicio actividad A/A primera planta"
    has_date: true
    has_time: true

  # Hora en la que Suite empieza a enfriar segun la inferencia por bajada de
  # temperatura.
  suite_aire_acondicionado_inicio_enfriamiento:
    name: "Inicio enfriamiento A/A suite"
    has_date: true
    has_time: true

  # Hora en la que termina el periodo de enfriamiento de Suite justo antes de
  # confirmarse un fallo.
  suite_aire_acondicionado_fin_enfriamiento:
    name: "Fin enfriamiento A/A suite"
    has_date: true
    has_time: true

  # Hora en la que se confirma que Suite esta por encima de consigna y sin bajar
  # temperatura.
  suite_aire_acondicionado_inicio_parada:
    name: "Inicio sin enfriar sobre consigna A/A suite"
    has_date: true
    has_time: true

  # Hora en la que Suite vuelve a enfriar despues de un fallo confirmado.
  suite_aire_acondicionado_fin_parada:
    name: "Fin sin enfriar sobre consigna A/A suite"
    has_date: true
    has_time: true

input_number:
  # Consigna real del mando de Suite introducida manualmente antes de dormir.
  suite_aire_acondicionado_temperatura_consigna:
    name: "Consigna A/A suite"
    unit_of_measurement: "°C"
    icon: mdi:thermometer-auto
    initial: 25
    min: 16
    max: 30
    step: 0.5
    mode: box

  # Margen permitido sobre la consigna antes de considerar que Suite esta
  # demasiado caliente.
  suite_aire_acondicionado_margen_consigna:
    name: "Margen consigna A/A suite"
    unit_of_measurement: "°C"
    icon: mdi:plus-minus
    initial: 1
    min: 0
    max: 3
    step: 0.1
    mode: box

  # Temperatura de Suite al inicio inferido del enfriamiento.
  suite_aire_acondicionado_temperatura_inicio_enfriamiento:
    name: "Temperatura inicio enfriamiento A/A suite"
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    min: 0
    max: 50
    step: 0.1
    mode: box

  # Temperatura de Suite en el momento en que termina el periodo de enfriamiento
  # antes de confirmarse un fallo.
  suite_aire_acondicionado_temperatura_fin_enfriamiento:
    name: "Temperatura fin enfriamiento A/A suite"
    unit_of_measurement: "°C"
    icon: mdi:thermometer-check
    min: 0
    max: 50
    step: 0.1
    mode: box

  # Temperatura de Suite en el momento en que se confirma el fallo.
  suite_aire_acondicionado_temperatura_inicio_parada:
    name: "Temperatura inicio sin enfriar sobre consigna A/A suite"
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    min: 0
    max: 50
    step: 0.1
    mode: box

  # Potencia instantanea total del A/A de primera planta al confirmarse el fallo.
  suite_aire_acondicionado_potencia_inicio_parada:
    name: "Potencia inicio sin enfriar sobre consigna A/A suite"
    unit_of_measurement: "W"
    icon: mdi:flash-alert
    min: 0
    max: 10000
    step: 1
    mode: box

  # Potencia media total del A/A de primera planta durante los 30 minutos previos
  # al fallo confirmado.
  suite_aire_acondicionado_potencia_media_30min_inicio_parada:
    name: "Potencia media 30min inicio sin enfriar A/A suite"
    unit_of_measurement: "W"
    icon: mdi:flash-alert
    min: 0
    max: 10000
    step: 1
    mode: box

  # Minutos desde que el A/A de primera planta empezo a estar activo hasta el
  # ultimo fallo confirmado de Suite.
  suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo:
    name: "Tiempo actividad hasta fallo A/A suite"
    unit_of_measurement: "min"
    icon: mdi:timer-alert-outline
    min: 0
    max: 720
    step: 1
    mode: box

  # Minutos desde que Suite empezo a enfriar hasta el ultimo fallo confirmado.
  suite_aire_acondicionado_tiempo_enfriamiento_ultimo:
    name: "Tiempo ultimo enfriamiento A/A suite"
    unit_of_measurement: "min"
    icon: mdi:timer-check
    min: 0
    max: 720
    step: 1
    mode: box

  # Minutos que duro el ultimo fallo confirmado de Suite.
  suite_aire_acondicionado_tiempo_parada_ultimo:
    name: "Tiempo ultimo sin enfriar sobre consigna A/A suite"
    unit_of_measurement: "min"
    icon: mdi:timer-alert
    min: 0
    max: 720
    step: 1
    mode: box
