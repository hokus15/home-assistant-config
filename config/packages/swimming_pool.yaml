###############################################################################
# RECORDER
###############################################################################

recorder:
  include:
    entities:
      # Actuadores
      - switch.motor_piscina
      - switch.piscina
      - switch.piscina_luz_principal

      # Sensores principales
      - sensor.piscina_water_temperature
      - sensor.piscina_filtration_time
      - sensor.piscina_pump_runtime_today

      # Estado de filtración
      - binary_sensor.piscina_filtration_pending

      - binary_sensor.piscina_pump_on_energy_export_over_threshold
      - binary_sensor.piscina_pump_on_enough_net_balance_hour
      - binary_sensor.piscina_pump_enough_net_balance_to_keep_on

###############################################################################
# LOGBOOK
###############################################################################

logbook:
  exclude:
    entities:
      - sensor.piscina_water_temperature
      - sensor.piscina_filtration_time
      - sensor.piscina_pump_runtime_today

      - binary_sensor.piscina_filtration_pending

###############################################################################
# MQTT
###############################################################################

mqtt:
  switch:
    - name: "Motor piscina"
      unique_id: motor_piscina
      icon: mdi:pool

      state_topic: "home/switch/motor_piscina/stat/POWER"
      command_topic: "home/switch/motor_piscina/cmnd/POWER"
      availability_topic: "home/switch/motor_piscina/tele/LWT"

      payload_available: "Online"
      payload_not_available: "Offline"
      payload_off: "OFF"
      payload_on: "ON"

      retain: false

    - name: "Luz piscina"
      unique_id: luz_piscina
      icon: mdi:light-flood-down

      state_topic: "home/light/piscina/stat/POWER"
      command_topic: "home/light/piscina/cmnd/POWER"
      availability_topic: "home/light/piscina/tele/LWT"

      payload_available: "Online"
      payload_not_available: "Offline"
      payload_off: "OFF"
      payload_on: "ON"

      retain: false

  sensor:
    - name: "Piscina water temperature"
      unique_id: piscina_water_temperature
      icon: mdi:pool-thermometer

      state_topic: "home/switch/motor_piscina/tele/SENSOR"

      value_template: >-
        {{
          value_json.DS18B20.Temperature | float(0)
          + states('input_number.temperature_correction') | float(0)
        }}

      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

###############################################################################
# SENSORES
###############################################################################

sensor:
  # Tiempo durante el que la bomba ha permanecido encendida dentro
  # del periodo diario comprendido entre las 07:00 y las 07:00
  # del día siguiente.
  - platform: history_stats
    name: "Piscina pump runtime today"
    unique_id: piscina_pump_runtime_today

    entity_id: switch.motor_piscina
    state: "on"
    type: time

    end: >-
      {{
        (now().replace(minute=0, second=0, microsecond=0)
        + timedelta(hours=17)).replace(hour=7)
      }}

    duration:
      hours: 24

###############################################################################
# TEMPLATE - DIMENSIONES Y CÁLCULOS HIDRÁULICOS
###############################################################################

template:
  - sensor:
      - name: "Piscina width"
        unique_id: piscina_width
        state: "3.5"
        unit_of_measurement: "m"
        icon: mdi:arrow-expand-horizontal

      - name: "Piscina length"
        unique_id: piscina_length
        state: "7"
        unit_of_measurement: "m"
        icon: mdi:arrow-expand-horizontal

      - name: "Piscina average depth"
        unique_id: piscina_average_depth
        state: "1.6"
        unit_of_measurement: "m"
        icon: mdi:arrow-expand-vertical

      - name: "Piscina pump nominal flow"
        unique_id: piscina_pump_nominal_flow
        state: "16"
        unit_of_measurement: "m³/h"
        icon: mdi:waves-arrow-right

      # Relación entre el caudal efectivo de la instalación y el
      # caudal nominal de la bomba.
      #
      # Tiene en cuenta las pérdidas hidráulicas producidas por el
      # filtro, tuberías, válvulas y accesorios.
      #
      # Caudal efectivo = Caudal nominal × Eficiencia hidráulica
      #
      # Valores orientativos:
      #   0,90 - Instalación muy favorable
      #   0,80 - Instalación doméstica típica
      #   0,70 - Instalación con pérdidas elevadas
      - name: "Piscina hydraulic efficiency"
        unique_id: piscina_hydraulic_efficiency
        state: "0.8"
        icon: mdi:gauge

      # Volumen aproximado de la piscina.
      - name: "Piscina volume"
        unique_id: piscina_volume

        state: >-
          {% set width = states('sensor.piscina_width') | float(0) %}
          {% set length = states('sensor.piscina_length') | float(0) %}
          {% set depth = states('sensor.piscina_average_depth') | float(0) %}

          {{ (width * length * depth) | round(1) }}

        availability: >-
          {{
            has_value('sensor.piscina_width')
            and has_value('sensor.piscina_length')
            and has_value('sensor.piscina_average_depth')
          }}

        unit_of_measurement: "m³"
        state_class: measurement
        icon: mdi:pool

      # Tiempo necesario para recircular un volumen equivalente al
      # volumen total de la piscina.
      - name: "Piscina turnover time"
        unique_id: piscina_turnover_time

        state: >-
          {% set volume = states('sensor.piscina_volume') | float(0) %}
          {% set nominal_flow = states('sensor.piscina_pump_nominal_flow') | float(0) %}
          {% set efficiency = states('sensor.piscina_hydraulic_efficiency') | float(0) %}

          {% set effective_flow = nominal_flow * efficiency %}

          {{
            (volume / effective_flow) | round(2)
            if effective_flow > 0
            else 0
          }}

        availability: >-
          {{
            has_value('sensor.piscina_volume')
            and has_value('sensor.piscina_pump_nominal_flow')
            and has_value('sensor.piscina_hydraulic_efficiency')
          }}

        unit_of_measurement: "h"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sync-outline

###############################################################################
# TEMPLATE - TEMPERATURA Y RENOVACIONES OBJETIVO
###############################################################################

  - binary_sensor:
      - name: "Piscina water temperature valid"
        unique_id: piscina_water_temperature_valid

        state: "{{ is_state('switch.motor_piscina', 'on') }}"

        # Tiempo necesario para que la temperatura medida represente
        # la temperatura real del agua.
        delay_on: "00:05:00"

  - sensor:
      # Número objetivo de renovaciones teóricas diarias en función
      # de la temperatura del agua.
      #
      # La progresión continua evita cambios bruscos en el tiempo
      # de filtración al cruzar los distintos umbrales de temperatura.
      #
      # Menos de 10 °C: 0,25 renovaciones
      # 15 °C:          0,75 renovaciones
      # 18 °C:          1,00 renovación
      # 24 °C:          1,50 renovaciones
      # 30 °C:          2,00 renovaciones
      # 32 °C:          2,25 renovaciones
      # 34 °C o más:    2,50 renovaciones
      - name: "Piscina target turnovers"
        unique_id: piscina_target_turnovers

        state: >-
          {% if not is_state('binary_sensor.piscina_water_temperature_valid', 'on') %}
            {{ this.state if this.state not in ['unknown','unavailable','none',''] else 1 }}
          {% else %}

            {% set temperature =
              states('sensor.piscina_water_temperature') | float(0)
            %}

            {% if temperature < 10 %}
              0.25
            {% elif temperature < 15 %}
              {{ (0.25 + ((temperature - 10) * 0.10)) | round(2) }}
            {% elif temperature < 18 %}
              {{ (0.75 + ((temperature - 15) / 12)) | round(2) }}
            {% elif temperature < 24 %}
              {{ (1 + ((temperature - 18) / 12)) | round(2) }}
            {% elif temperature < 30 %}
              {{ (1.5 + ((temperature - 24) / 12)) | round(2) }}
            {% elif temperature < 34 %}
              {{ (2 + ((temperature - 30) * 0.125)) | round(2) }}
            {% else %}
              2.5
            {% endif %}

          {% endif %}

        availability: >-
          {{ has_value('sensor.piscina_water_temperature') }}

        state_class: measurement
        icon: mdi:rotate-360

###############################################################################
# TEMPLATE - TIEMPO DIARIO DE FILTRACIÓN
###############################################################################

  - trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id:
          - sensor.piscina_turnover_time
          - sensor.piscina_target_turnovers

    sensor:
      - name: "Piscina filtration time"
        unique_id: piscina_filtration_time

        state: >-
          {% set turnover_time =
            states('sensor.piscina_turnover_time') | float(0)
          %}
          {% set target_turnovers =
            states('sensor.piscina_target_turnovers') | float(0)
          %}

          {% set filtration_time = turnover_time * target_turnovers %}

          {{ [8, [1, filtration_time] | max] | min | round(1) }}

        availability: >-
          {{
            has_value('sensor.piscina_turnover_time')
            and has_value('sensor.piscina_target_turnovers')
          }}

        unit_of_measurement: "h"
        device_class: duration
        state_class: measurement
        icon: mdi:pump

###############################################################################
# TEMPLATE - ESTADO Y CONTROL DE LA BOMBA
###############################################################################

  - binary_sensor:

      # Detecta si la bomba está funcionando mediante la potencia eléctrica.
      - name: "Piscina general status"
        unique_id: piscina_general_status

        state: "{{ states('sensor.piscina_power') | float(0) > 5 }}"

        delay_off: "00:00:10"

        icon: mdi:pool

        attributes:
          power: "{{ states('sensor.piscina_power') }} W"

      # Hay suficiente excedente instantáneo para arrancar la bomba.
      - name: "Piscina pump on energy export over threshold"
        unique_id: piscina_pump_on_energy_export_over_threshold

        state: >-
          {{
            states('sensor.fronius_solarnet_power_grid') | float(0)
            <= states('input_number.piscina_pump_on_threshold') | float(0)
          }}

        delay_on: >-
          {{
            timedelta(
              minutes=states('input_number.piscina_pump_on_delay') | int(0)
            )
          }}

      # El balance energético acumulado durante la hora permite
      # arrancar la bomba.
      - name: "Piscina pump on enough net balance hour"
        unique_id: piscina_pump_on_enough_net_balance_hour

        state: >-
          {{
            states('sensor.energy_net_balance_hour') | float(0)
            <= states('input_number.piscina_pump_on_net_balance_hour_threshold') | float(0)
          }}

      # Todavía queda tiempo objetivo de filtración pendiente.
      - name: "Piscina filtration pending"
        unique_id: piscina_filtration_pending

        state: >-
          {{
            states('sensor.piscina_pump_runtime_today') | float(0)
            < states('sensor.piscina_filtration_time') | float(0)
          }}

      # El balance energético acumulado sigue siendo suficiente
      # para mantener la bomba encendida.
      - name: "Piscina pump enough net balance to keep on"
        unique_id: piscina_pump_enough_net_balance_to_keep_on

        state: >-
          {{
            states('sensor.energy_net_balance_hour') | float(0)
            <= states('input_number.piscina_pump_off_net_balance_hour_threshold') | float(0)
          }}

###############################################################################
# PARÁMETROS CONFIGURABLES
###############################################################################

input_number:
  temperature_correction:
    name: "Corrección temperatura piscina"
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines

    min: -5
    max: 5
    step: 0.5
    mode: box

  # Potencia mínima exportada para permitir el encendido de la bomba.
  #
  # Valores negativos representan exportación a la red.
  piscina_pump_on_threshold:
    name: "Potencia para encendido"
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt

    initial: -1200
    min: -3500
    max: 0
    step: 100

  # Tiempo durante el que debe mantenerse el excedente mínimo
  # antes de permitir el encendido.
  piscina_pump_on_delay:
    name: "Retardo encendido"
    unit_of_measurement: "min"
    icon: mdi:clock-in

    initial: 2
    min: 0
    max: 60
    step: 1

  # Balance energético horario máximo para permitir el encendido.
  #
  # Cuanto más negativo sea el valor, más excedente acumulado
  # se exigirá antes de arrancar la bomba.
  piscina_pump_on_net_balance_hour_threshold:
    name: "Balance horario para encendido"
    unit_of_measurement: "kWh"
    icon: mdi:transmission-tower-export

    initial: -0.2
    min: -1
    max: 0
    step: 0.1

  # Balance energético horario máximo permitido para mantener
  # la bomba funcionando.
  #
  # Si el balance supera este valor, la bomba podrá detenerse.
  piscina_pump_off_net_balance_hour_threshold:
    name: "Balance horario para mantener encendida"
    unit_of_measurement: "kWh"
    icon: mdi:transmission-tower-import

    initial: 0.1
    min: 0
    max: 0.5
    step: 0.01
