recorder:
  include:
    entities:
      - binary_sensor.lavaplatos_status
      - sensor.lavaplatos_switch_0_power
      - sensor.lavaplatos_switch_0_energy

template:
  - binary_sensor:
      - name: lavaplatos_status
        unique_id: lavaplatos_status
        state: "{{ states('sensor.lavaplatos_switch_0_power') | float(default=0) > 5 }}"
        delay_off: "0:05:00"
        icon: >-
          {% if states('sensor.lavaplatos_switch_0_power') | float(default=0) > 5 -%}
            mdi:dishwasher
          {%- else -%}
            mdi:dishwasher-off
          {%- endif %}
        attributes:
          power: "{{ states('sensor.lavaplatos_switch_0_power') }}W"
