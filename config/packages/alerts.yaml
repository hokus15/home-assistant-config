recorder:
  include:
    entities:
      - binary_sensor.energy_waste_alert
      - binary_sensor.piscina_depuradora_encendida_alerta
      - binary_sensor.piscina_temperatura_agua_estimada

template:
  - binary_sensor:
      - name: "energy_waste_alert"
        state: >-
          {{ label_entities('comprobacion_desperdicio_energetico') | expand | selectattr('state', 'eq', 'on') | list | count > 0
             and not is_state('climate.recibidor', 'off')
             and is_state_attr('climate.recibidor', 'hvac_action', 'heating') }}

      - name: "piscina_depuradora_encendida_alerta"
        state: >-
          {{ is_state('switch.piscina_depuradora', 'on')
             and states.sensor.piscina_depuradora_tiempo_funcionamiento_hoy.state | float(0) > states.sensor.piscina_tiempo_filtrado.state | float(0) }}

alert:
  entrada_barrera_abierta:
    name: Barrera abierta
    entity_id: cover.entrada_barrera
    state: "open"
    repeat: 10
    message: "Barrera abierta durante más de {{ (as_timestamp(now()) - as_timestamp(states.cover.entrada_barrera.last_changed))|int//60 }} minutos."
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Cerrar:/switch.turn_on#switch.entrada_barrera"
        - "Enterado:/alert.turn_off#alert.entrada_barrera_abierta"
    notifiers:
      - recibidor
      - despacho
      - telegram_hokusphone

  energy_waste_alert:
    name: Alerta de desperdicio energético
    entity_id: binary_sensor.energy_waste_alert
    state: "on"
    repeat: 10
    message: >-
      {% for entity in label_entities('comprobacion_desperdicio_energetico') | expand | selectattr('state', 'eq', 'on') | list %}
            La {{entity.attributes.friendly_name}} lleva más de {{ relative_time(entity.last_changed) | replace('hours','horas') | replace('hour','hora') | replace('minutes','minutos') | replace('minute','minuto') }} abierta y la calefacción está encendida.
      {%- endfor %}
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Enterado:/alert.turn_off#alert.energy_waste_alert"
    notifiers:
      - recibidor
      - suite
      - despacho
      - telegram_hokusphone

  piscina_depuradora_encendida:
    name: Motor piscina encendido
    entity_id: binary_sensor.piscina_depuradora_encendida_alerta
    state: "on"
    repeat: 5
    message: "Motor de la piscina encendido hoy durante {{ ((states.sensor.piscina_depuradora_tiempo_funcionamiento_hoy.state | float(0) * 60) // 60) | round(0) }} horas y {{ ((states.sensor.piscina_depuradora_tiempo_funcionamiento_hoy.state | float(0) * 60) % 60) | round(0) }} minutos cuando el tiempo programado es de {{ ((states.sensor.piscina_tiempo_filtrado.state | float(0) * 60) // 60) | round(0) }} horas y {{ ((states.sensor.piscina_tiempo_filtrado.state | float(0) * 60) % 60) | round(0) }} minutos."
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Apagar:/switch.turn_off#switch.piscina_depuradora"
        - "Enterado:/alert.turn_off#alert.piscina_depuradora_encendida"
    notifiers:
      - recibidor
      - despacho
      - telegram_hokusphone

  piscina_temperatura_agua_estimada:
    name: Temperatura de agua estimada
    entity_id: binary_sensor.piscina_temperatura_agua_estimada
    state: "on"
    # Alert exige repeat. Evita ruido pero recuerda diariamente un fallo
    # persistente de la sonda.
    repeat: 1440
    skip_first: false
    message: >-
      La sonda de temperatura del agua de la piscina no proporciona una lectura
      válida. La filtración usa una estimación de
      {{ states('sensor.piscina_temperatura_agua_referencia') }} °C basada en
      la temperatura exterior ({{ states('sensor.exterior_temperature') }} °C).
    notifiers:
      - telegram_hokusphone
