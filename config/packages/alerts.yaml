recorder:
  include:
    entities:
      - binary_sensor.energy_waste_alert
      - binary_sensor.motor_piscina_encendido_alerta
      - binary_sensor.swimming_pool_circuit_breaker_alert
      - binary_sensor.gfci_alert
      - binary_sensor.cocina_enchufes_estado

template:
  - binary_sensor:
      - name: "energy_waste_alert"
        state: >-
          {{ label_entities('comprobacion_desperdicio_energetico') | expand | selectattr('state', 'eq', 'on') | list | count > 0
             and not is_state('climate.recibidor', 'off')
             and is_state_attr('climate.recibidor', 'hvac_action', 'heating') }}

      - name: "swimming_pool_circuit_breaker_alert"
        state: >-
          {{  is_state('binary_sensor.hueco_escalera_sai_red_electrica_activa', 'on')
             and is_state('binary_sensor.gfci_alert', 'off')
             and is_state('switch.motor_piscina', 'unavailable')
             and is_state('switch.piscina_luz_principal', 'unavailable')
             and is_state('switch.piscina', 'unavailable')}}

      # GFCI -> Ground fault circuit interrupter -> Diferencial
      - name: "gfci_alert"
        state: >-
          {{  is_state('binary_sensor.hueco_escalera_sai_red_electrica_activa', 'on')
             and is_state('switch.motor_piscina', 'unavailable')
             and is_state('switch.piscina_luz_principal', 'unavailable')
             and is_state('switch.piscina', 'unavailable')
             and is_state('switch.coladuria_lavadora', 'unavailable')
             and is_state('switch.coladuria_secadora', 'unavailable')
             and is_state('switch.cocina_lavavajillas', 'unavailable')
             and is_state('camera.barbacoa', 'unavailable')
             and is_state('camera.piscina', 'unavailable')
             and is_state('camera.caseta', 'unavailable')
             and is_state('switch.coladuria_cargador_ev', 'unavailable')
             }}

      - name: "Cocina enchufes estado"
        unique_id: cocina_enchufes_estado
        device_class: problem
        state: >-
          {{ is_state('binary_sensor.hueco_escalera_sai_red_electrica_activa', 'on')
             and is_state('switch.cocina_nevera', 'unavailable')
             and is_state('switch.cocina_congelador', 'unavailable')
             and has_value('switch.coladuria_lavadora')
             and has_value('switch.coladuria_secadora') }}
        delay_on: "00:01:30"

      - name: "motor_piscina_encendido_alerta"
        state: >-
          {{ is_state('switch.motor_piscina', 'on')
             and states.sensor.piscina_pump_runtime_today.state | float(0) > states.sensor.piscina_filtration_time.state | float(0) }}

alert:
  entrada_barrera_abierta:
    name: Barrera abierta
    entity_id: cover.entrada_barrera
    state: "open"
    repeat: 10
    message: "Barrera abierta durante más de {{ (as_timestamp(now()) - as_timestamp(states.cover.entrada_barrera.last_changed))|int//60 }} minutos."
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Cerrar:/switch.turn_on#switch.entrada_barrera"
        - "Enterado:/alert.turn_off#alert.entrada_barrera_abierta"
    notifiers:
      - recibidor
      - despacho
      - telegram_hokusphone

  energy_waste_alert:
    name: Alerta de desperdicio energético
    entity_id: binary_sensor.energy_waste_alert
    state: "on"
    repeat: 10
    message: >-
      {% for entity in label_entities('comprobacion_desperdicio_energetico') | expand | selectattr('state', 'eq', 'on') | list %}
            La {{entity.attributes.friendly_name}} lleva más de {{ relative_time(entity.last_changed) | replace('hours','horas') | replace('hour','hora') | replace('minutes','minutos') | replace('minute','minuto') }} abierta y la calefacción está encendida.
      {%- endfor %}
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Enterado:/alert.turn_off#alert.energy_waste_alert"
    notifiers:
      - recibidor
      - suite
      - despacho
      - telegram_hokusphone

  motor_piscina_encendido:
    name: Motor piscina encendido
    entity_id: binary_sensor.motor_piscina_encendido_alerta
    state: "on"
    repeat: 5
    message: "Motor de la piscina encendido hoy durante {{ ((states.sensor.piscina_pump_runtime_today.state | float(0) * 60) // 60) | round(0) }} horas y {{ ((states.sensor.piscina_pump_runtime_today.state | float(0) * 60) % 60) | round(0) }} minutos cuando el tiempo programado es de {{ ((states.sensor.piscina_filtration_time.state | float(0) * 60) // 60) | round(0) }} horas y {{ ((states.sensor.piscina_filtration_time.state | float(0) * 60) % 60) | round(0) }} minutos."
    can_acknowledge: true
    skip_first: true
    data:
      inline_keyboard:
        - "Apagar:/switch.turn_off#switch.motor_piscina"
        - "Enterado:/alert.turn_off#alert.motor_piscina_encendido"
    notifiers:
      - recibidor
      - despacho
      - telegram_hokusphone

  sp_cb_monitor_alert:
    # swimming_pool_circuit_breaker_monitor_alert -> sp_cb_monitor_alert
    # -> Cambio en el nombre para poder evitar llegar al máximo de carácteres en el inline keyboard de Telegram
    name: Magnetotermico piscina abajo
    entity_id: binary_sensor.swimming_pool_circuit_breaker_alert
    state: "on"
    repeat: 5
    message: "Es posible que haya saltado el magnetotérmico de la piscina. Los dispositivos afectados son: piscina (luz y depuradora), cámara de la caseta, cámara de la piscina y cámara de la barbacoa."
    can_acknowledge: true
    skip_first: false
    data:
      inline_keyboard:
        - "Enterado:/alert.turn_off#alert.sp_cb_monitor_alert"
    notifiers:
      - despacho
      - telegram_hokusphone

  gfci_monitor_alert:
    name: Diferencial abajo
    entity_id: binary_sensor.gfci_alert
    state: "on"
    repeat: 5
    message: "Es posible que haya saltado un diferencial. Los dispositivos afectados son: lavavajillas, piscina (luz y depuradora), lavadora, secadora, caldera, barrera, cargador del coche, aire acondicionado, cámara de la caseta, cámara de la piscina y cámara de la barbacoa."
    can_acknowledge: true
    skip_first: false
    data:
      inline_keyboard:
        - "Enterado:/alert.turn_off#alert.gfci_monitor_alert"
    notifiers:
      - despacho
      - telegram_hokusphone

  cocina_enchufes_estado:
    name: Enchufes cocina sin suministro
    entity_id: binary_sensor.cocina_enchufes_estado
    state: "on"
    repeat: 5
    message: >-
      Se ha interrumpido el suministro de los enchufes de cocina: la nevera y el
      congelador no están disponibles. Puede haber saltado el magnetotérmico de
      enchufes de cocina o el diferencial que lo protege.
    can_acknowledge: true
    skip_first: false
    data:
      inline_keyboard:
        - "Enterado:/alert.turn_off#alert.cocina_enchufes_estado"
    notifiers:
      - despacho
      - telegram_hokusphone
