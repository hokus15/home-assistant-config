recorder:
  include:
    entities:
      - binary_sensor.secadora_status
      - sensor.secadora_power
      - sensor.secadora_energy
      - switch.secadora

template:
  - binary_sensor:
      - name: "Secadora status"
        unique_id: secadora_status
        device_class: running
        availability: >
          {{ is_number(states('sensor.secadora_power')) }}
        state: >
          {{ states('sensor.secadora_power') | float > 5 }}
        delay_off: "00:05:00"
        icon: >
          {% if states('sensor.secadora_power') | float(0) > 5 %}
            mdi:tumble-dryer
          {% else %}
            mdi:tumble-dryer-off
          {% endif %}
        attributes:
          power: >
            {{ states('sensor.secadora_power') | float(0) | round(0) }} W