recorder:
  include:
    entities:
      - sensor.aire_acondicionado_primera_planta_energia
      - sensor.aire_acondicionado_primera_planta_potencia

      - binary_sensor.aire_acondicionado_primera_planta_activo

template:
  - binary_sensor:
      - name: "Aire acondicionado primera planta activo"
        unique_id: aire_acondicionado_primera_planta_activo
        availability: >
          {{ is_number(states('sensor.aire_acondicionado_primera_planta_potencia')) }}
        state: >
          {{ states('sensor.aire_acondicionado_primera_planta_potencia') | float > 50 }}
        delay_off: "00:01:00"
        icon: >
          {% if states('sensor.aire_acondicionado_primera_planta_potencia') | float(0) > 50 %}
            mdi:hvac
          {% else %}
            mdi:hvac-off
          {% endif %}
        attributes:
          power: >
            {{ states('sensor.aire_acondicionado_primera_planta_potencia') | float(0) | round(0) }} W
