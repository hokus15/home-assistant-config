title: Diagnostico A/A suite
views:
  - title: A/A suite
    path: climatizacion-suite
    icon: mdi:snowflake-alert
    cards:
      - type: glance
        title: Estado actual
        columns: 3
        state_color: true
        entities:
          - entity: sensor.suite_temperature
            name: Temperatura
          - entity: sensor.suite_aire_acondicionado_diferencia_consigna
            name: Sobre consigna
          - entity: binary_sensor.aire_acondicionado_primera_planta_activo
            name: A/A 1P
          - entity: binary_sensor.suite_temperatura_bajando
            name: Bajando
          - entity: binary_sensor.suite_aire_acondicionado_enfriando
            name: Enfriando
          - entity: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
            name: Sin enfriar sobre consigna
          - entity: binary_sensor.habitacion_carlos_aire_acondicionado_enfriando
            name: Carlos enfriando
          - entity: binary_sensor.habitacion_coque_aire_acondicionado_enfriando
            name: Coque enfriando
          - entity: sensor.aire_acondicionado_primera_planta_splits_enfriando
            name: Total enfriando
          - entity: sensor.aire_acondicionado_primera_planta_otros_splits_enfriando
            name: Otros enfriando
          - entity: counter.suite_aire_acondicionado_fallos_nocturnos
            name: Fallos esta noche
          - entity: input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno
            name: Suite enfriando esta noche

      - type: entities
        title: Parametros de prueba
        show_header_toggle: false
        entities:
          - entity: input_boolean.suite_aire_acondicionado_prueba_activa
            name: Prueba Suite activa
          - entity: input_number.suite_aire_acondicionado_temperatura_consigna
            name: Consigna
          - entity: input_number.suite_aire_acondicionado_margen_consigna
            name: Margen
          - entity: sensor.suite_aire_acondicionado_diferencia_consigna
            name: Diferencia con consigna
          - type: divider
          - entity: input_boolean.suite_aire_acondicionado_previsto
            name: Suite previsto
          - entity: input_boolean.habitacion_carlos_aire_acondicionado_previsto
            name: Carlos previsto
          - entity: input_boolean.habitacion_coque_aire_acondicionado_previsto
            name: Coque previsto

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.suite_temperature
            name: Suite
            min: 20
            max: 32
            severity:
              green: 0
              yellow: 25
              red: 27
          - type: gauge
            entity: sensor.suite_aire_acondicionado_diferencia_consigna
            name: Sobre consigna
            min: -3
            max: 6
            severity:
              green: -3
              yellow: 1
              red: 2

      - type: entities
        title: Episodio actual
        show_header_toggle: false
        entities:
          - entity: input_datetime.suite_aire_acondicionado_inicio_actividad
            name: Inicio actividad A/A 1P
          - entity: sensor.suite_aire_acondicionado_tiempo_enfriamiento_actual
            name: Tiempo enfriando
          - entity: sensor.suite_aire_acondicionado_tiempo_parada_actual
            name: Tiempo sin enfriar sobre consigna
          - entity: input_datetime.suite_aire_acondicionado_inicio_enfriamiento
            name: Inicio enfriamiento
          - entity: input_datetime.suite_aire_acondicionado_fin_enfriamiento
            name: Fin enfriamiento
          - entity: input_datetime.suite_aire_acondicionado_inicio_parada
            name: Inicio sin enfriar sobre consigna
          - entity: input_datetime.suite_aire_acondicionado_fin_parada
            name: Fin sin enfriar sobre consigna

      - type: entities
        title: Inferencia otros splits
        show_header_toggle: false
        entities:
          - entity: input_boolean.habitacion_carlos_aire_acondicionado_previsto
            name: Carlos previsto
          - entity: binary_sensor.habitacion_carlos_temperatura_bajando
            name: Temperatura Carlos bajando
          - entity: binary_sensor.habitacion_carlos_aire_acondicionado_enfriando
            name: Carlos contado como enfriando
          - entity: input_boolean.habitacion_coque_aire_acondicionado_previsto
            name: Coque previsto
          - entity: binary_sensor.habitacion_coque_temperatura_bajando
            name: Temperatura Coque bajando
          - entity: binary_sensor.habitacion_coque_aire_acondicionado_enfriando
            name: Coque contado como enfriando
          - entity: sensor.aire_acondicionado_primera_planta_splits_enfriando
            name: Total splits enfriando
          - entity: sensor.aire_acondicionado_primera_planta_otros_splits_enfriando
            name: Otros splits enfriando
          - entity: binary_sensor.suite_aire_acondicionado_compitiendo
            name: Suite compitiendo

      - type: entities
        title: Ultimo episodio
        show_header_toggle: false
        entities:
          - entity: sensor.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo
            name: Tiempo A/A activo hasta fallo
          - entity: sensor.suite_aire_acondicionado_tiempo_enfriamiento_ultimo
            name: Tiempo Suite enfriando hasta fallo
          - entity: sensor.suite_aire_acondicionado_descenso_enfriamiento_ultimo
            name: Descenso conseguido
          - entity: sensor.suite_aire_acondicionado_tiempo_parada_ultimo
            name: Tiempo sin enfriar sobre consigna
          - entity: input_number.suite_aire_acondicionado_temperatura_inicio_enfriamiento
            name: Temperatura inicio enfriamiento
          - entity: input_number.suite_aire_acondicionado_temperatura_fin_enfriamiento
            name: Temperatura fin enfriamiento
          - entity: input_number.suite_aire_acondicionado_temperatura_inicio_parada
            name: Temperatura inicio sin enfriar sobre consigna
          - entity: input_number.suite_aire_acondicionado_potencia_inicio_parada
            name: Potencia inicio sin enfriar sobre consigna
          - entity: input_number.suite_aire_acondicionado_potencia_media_30min_inicio_parada
            name: Potencia media 30min previa

      - type: logbook
        title: Registro automatico de diagnostico (48 h)
        hours_to_show: 48
        entities:
          - binary_sensor.suite_aire_acondicionado_parado_sin_consigna

      - type: history-graph
        title: Evidencia principal 24h
        hours_to_show: 24
        entities:
          - entity: sensor.suite_temperature
            name: Temperatura suite
          - entity: sensor.suite_aire_acondicionado_diferencia_consigna
            name: Diferencia consigna
          - entity: binary_sensor.suite_aire_acondicionado_enfriando
            name: Enfriando
          - entity: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
            name: Sin enfriar sobre consigna

      - type: custom:apexcharts-card
        graph_span: 18h
        header:
          show: true
          title: Temperaturas vs potencia y competencia
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 500
          stroke:
            curve: smooth
          legend:
            show: true
        yaxis:
          - id: temperature
            decimals: 1
            apex_config:
              title:
                text: Temperatura (°C)
          - id: power
            opposite: true
            min: 0
            decimals: 0
            apex_config:
              title:
                text: Potencia (W)
          - id: state
            opposite: true
            min: 0
            max: 3
            decimals: 0
            show: false
        series:
          - entity: sensor.suite_temperature
            name: Suite
            yaxis_id: temperature
            stroke_width: 3
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.habitacion_carlos_temperature
            name: Carlos
            yaxis_id: temperature
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.habitacion_coque_temperature
            name: Coque
            yaxis_id: temperature
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.exterior_temperature
            name: Exterior
            yaxis_id: temperature
            stroke_width: 1
            opacity: 0.5
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.aire_acondicionado_primera_planta_potencia
            name: Potencia A/A 1P
            yaxis_id: power
            type: area
            stroke_width: 1
            opacity: 0.25
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.aire_acondicionado_primera_planta_otros_splits_enfriando
            name: Otros splits enfriando
            yaxis_id: state
            type: column
            stroke_width: 0
            opacity: 0.35
            group_by:
              func: max
              duration: 5min
          - entity: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
            name: Suite sin enfriar sobre consigna
            yaxis_id: state
            type: column
            stroke_width: 0
            opacity: 0.55
            transform: "return x === 'on' ? 3 : 0;"
            group_by:
              func: max
              duration: 5min
          - entity: binary_sensor.suite_aire_acondicionado_compitiendo
            name: Suite compitiendo
            yaxis_id: state
            type: column
            stroke_width: 0
            opacity: 0.75
            transform: "return x === 'on' ? 2 : 0;"
            group_by:
              func: max
              duration: 5min

      - type: history-graph
        title: Correlacion con potencia 24h
        hours_to_show: 24
        entities:
          - entity: sensor.suite_temperature
            name: Temperatura suite
          - entity: sensor.aire_acondicionado_primera_planta_potencia
            name: Potencia A/A 1P
          - entity: binary_sensor.aire_acondicionado_primera_planta_activo
            name: A/A 1P activo
          - entity: binary_sensor.suite_temperatura_bajando
            name: Temperatura bajando
          - entity: binary_sensor.habitacion_carlos_aire_acondicionado_enfriando
            name: Carlos enfriando
          - entity: binary_sensor.habitacion_coque_aire_acondicionado_enfriando
            name: Coque enfriando
          - entity: binary_sensor.suite_aire_acondicionado_compitiendo
            name: Suite compitiendo

      - type: history-graph
        title: Detalle ultimas 6h
        hours_to_show: 6
        entities:
          - entity: sensor.suite_temperature
            name: Temperatura suite
          - entity: sensor.suite_aire_acondicionado_tiempo_enfriamiento_actual
            name: Minutos enfriando
          - entity: sensor.suite_aire_acondicionado_tiempo_parada_actual
            name: Minutos sin enfriar sobre consigna
          - entity: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
            name: Sin enfriar sobre consigna
