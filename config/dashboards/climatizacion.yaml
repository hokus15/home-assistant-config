title: Climatizacion
views:
  - title: Climatizacion
    path: climatizacion
    icon: mdi:thermostat
    cards:
      - type: glance
        title: Estado ahora
        columns: 3
        state_color: true
        entities:
          - entity: climate.recibidor_termostato
            name: Calefaccion
          - entity: sensor.home_temperature
            name: Casa
          - entity: sensor.exterior_temperature
            name: Exterior
          - entity: binary_sensor.climatizacion_planta_baja_aire_acondicionado_total_activo
            name: A/A PB
          - entity: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
            name: A/A 1P
          - entity: sensor.energy_tariff
            name: Tarifa

      - type: thermostat
        entity: climate.recibidor_termostato
        name: Calefaccion

      - type: entities
        title: Control calefaccion
        show_header_toggle: false
        entities:
          - entity: input_boolean.calefaccion_temporada_activo
            name: Calefacción habilitada por temporada
          - entity: sensor.recibidor_termostato_temperatura
            name: Temperatura recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Objetivo termostato
          - entity: sensor.home_temperature
            name: Media casa
          - entity: sensor.home_temperature_stats
            name: Media 24h
          - entity: sensor.ground_floor_temperature
            name: Media planta baja
          - entity: sensor.first_floor_temperature
            name: Media primera planta
          - entity: input_boolean.sleep_mode
            name: Modo dormir

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.home_temperature
            name: Casa
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26
          - type: gauge
            entity: sensor.ground_floor_temperature
            name: PB
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26
          - type: gauge
            entity: sensor.first_floor_temperature
            name: 1P
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26

      - type: history-graph
        title: Temperaturas 24h
        hours_to_show: 24
        entities:
          - entity: sensor.exterior_temperature
            name: Exterior
          - entity: sensor.home_temperature
            name: Casa
          - entity: sensor.ground_floor_temperature
            name: Planta baja
          - entity: sensor.first_floor_temperature
            name: Primera planta
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Objetivo

      - type: entities
        title: Temperatura por estancia
        show_header_toggle: false
        entities:
          - entity: sensor.salon_temperature
            name: Salon
          - entity: sensor.recibidor_termostato_temperatura
            name: Recibidor
          - entity: sensor.despacho_movimiento_temperatura
            name: Despacho
          - entity: sensor.cocina_puerta_porche_temperatura
            name: Cocina
          - entity: sensor.suite_temperature
            name: Suite
          - entity: sensor.habitacion_carlos_temperature
            name: Habitacion Carlos
          - entity: sensor.habitacion_coque_temperature
            name: Habitacion Coque

      - type: entities
        title: Humedad y CO2
        show_header_toggle: false
        entities:
          - entity: sensor.exterior_humidity
            name: Humedad exterior
          - entity: sensor.salon_humidity
            name: Humedad salon
          - entity: sensor.suite_humidity
            name: Humedad suite
          - entity: sensor.habitacion_carlos_humidity
            name: Humedad Carlos
          - entity: sensor.habitacion_coque_humidity
            name: Humedad Coque
          - entity: sensor.salon_co2
            name: CO2 salon
          - entity: sensor.suite_co2
            name: CO2 suite
          - entity: sensor.habitacion_carlos_co2
            name: CO2 Carlos
          - entity: sensor.habitacion_coque_co2
            name: CO2 Coque

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.energy_power_house
            name: Vivienda
            min: 0
            max: 10000
            severity:
              green: 0
              yellow: 3000
              red: 6000
          - type: gauge
            entity: sensor.energy_power_photovoltaics
            name: Solar
            min: 0
            max: 8000
            severity:
              red: 0
              yellow: 1000
              green: 3000
          - type: gauge
            entity: sensor.fronius_solarnet_power_grid
            name: Red
            min: -8000
            max: 8000
            severity:
              green: -8000
              yellow: 0
              red: 3000

      - type: entities
        title: Consumo climatizacion
        show_header_toggle: false
        entities:
          - entity: binary_sensor.climatizacion_planta_baja_aire_acondicionado_total_activo
            name: A/A planta baja activo
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_potencia
            name: Potencia A/A planta baja
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_energia
            name: Energia A/A planta baja
          - entity: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
            name: A/A primera planta activo
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_potencia
            name: Potencia A/A primera planta
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_energia
            name: Energia A/A primera planta
          - entity: climate.recibidor_termostato
            name: Calefaccion

      - type: history-graph
        title: Potencia climatizacion 24h
        hours_to_show: 24
        entities:
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_potencia
            name: A/A planta baja
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_potencia
            name: A/A primera planta
          - entity: sensor.energy_power_house
            name: Vivienda

      - type: history-graph
        title: Estado calefaccion 24h
        hours_to_show: 24
        entities:
          - entity: climate.recibidor_termostato
            name: Calefaccion

      - type: entities
        title: Energia hoy
        show_header_toggle: false
        entities:
          - entity: sensor.energy_grid_today_punta
            name: Punta
          - entity: sensor.energy_grid_today_llana
            name: Llana
          - entity: sensor.energy_grid_today_valle
            name: Valle
          - entity: sensor.energy_price_buy
            name: Precio compra
          - entity: sensor.energy_price_sell
            name: Precio venta
          - entity: sensor.energy_net_balance_hour
            name: Balance neto ultima hora
          - entity: sensor.energy_net_balance
            name: Balance neto

      - type: entities
        title: Contexto exterior
        show_header_toggle: false
        entities:
          - entity: weather.casa
            name: Tiempo
          - entity: sensor.exterior_temperature
            name: Temperatura exterior
          - entity: sensor.exterior_humidity
            name: Humedad exterior
          - entity: sensor.anemometro_wind_strength
            name: Viento
          - entity: sensor.pluviometro_rain
            name: Lluvia

  - title: Calefacción
    path: calefaccion
    icon: mdi:radiator
    cards:
      - type: glance
        title: Estado actual
        columns: 3
        state_color: true
        entities:
          - entity: climate.recibidor_termostato
            name: Termostato
          - entity: sensor.recibidor_termostato_temperatura
            name: Recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Consigna
          - entity: sensor.home_temperature
            name: Media casa
          - entity: sensor.home_temperature_stats
            name: Media 24 h
          - entity: binary_sensor.recibidor_termostato_activo
            name: Calentando (estimado)

      - type: thermostat
        entity: climate.recibidor_termostato
        name: Termostato del recibidor

      - type: entities
        title: Temporada
        show_header_toggle: false
        entities:
          - entity: input_boolean.calefaccion_temporada_activo
            name: Calefacción habilitada
          - entity: sensor.home_temperature_stats
            name: Temperatura media de 24 h
          - entity: input_number.calefaccion_temporada_temperatura_activar
            name: Activar por debajo de
          - entity: input_number.calefaccion_temporada_temperatura_desactivar
            name: Desactivar por encima de

      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.calefaccion_umbrales_inicializado
            state: "on"
          - condition: state
            entity: binary_sensor.calefaccion_umbrales_validos
            state: "off"
        card:
          type: markdown
          content: "**Umbrales inválidos:** activar debe ser menor que desactivar."

      - type: glance
        title: Presencia y vacaciones
        columns: 3
        state_color: true
        entities:
          - entity: group.invitado_y_familia
            name: Familia e invitados
            tap_action:
              action: more-info
          - entity: binary_sensor.calefaccion_presencia
            name: Presencia calefacción
            tap_action:
              action: more-info
          - entity: switch.holiday
            name: Vacaciones
            tap_action:
              action: more-info

      - type: history-graph
        title: Temperatura y consigna · 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.recibidor_termostato_temperatura
            name: Recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Consigna
          - entity: sensor.home_temperature
            name: Media casa

      - type: glance
        title: Avisos de puertas y ventanas
        columns: 2
        state_color: true
        entities:
          - entity: binary_sensor.energy_waste_alert
            name: Condición de aviso
          - entity: alert.energy_waste_alert
            name: Estado de la alerta
            tap_action:
              action: more-info

      - type: markdown
        title: Puertas y ventanas abiertas
        content: |-
          {% set monitored = label_entities('comprobacion_desperdicio_energetico') | expand | list %}
          {% set opened = monitored | selectattr('state', 'eq', 'on') | list %}
          {% if monitored | count == 0 %}
          Sin sensores configurados.
          {% elif opened | count == 0 %}
          Ninguna abierta.
          {% else %}
          {% for entity in opened %}
          {% set minutes = ((as_timestamp(now()) - as_timestamp(entity.last_changed)) / 60) | int %}
          - **{{ entity.name }}**: {{ minutes }} min abierta{{ ' · Más de 10 min' if as_timestamp(now()) - as_timestamp(entity.last_changed) > 600 else '' }}.
          {% endfor %}
          {% endif %}
          {% set missing = monitored | rejectattr('state', 'in', ['on', 'off']) | list %}
          {% if missing | count > 0 %}

          **Sin datos:** {{ missing | map(attribute='name') | join(', ') }}.
          {% endif %}


      - type: conditional
        conditions:
          - condition: state
            entity: alert.energy_waste_alert
            state: "on"
        card:
          type: button
          name: Silenciar aviso actual
          icon: mdi:bell-off
          tap_action:
            action: perform-action
            perform_action: alert.turn_off
            target:
              entity_id: alert.energy_waste_alert

      - type: conditional
        conditions:
          - condition: state
            entity: alert.energy_waste_alert
            state: "off"
        card:
          type: button
          name: Reactivar avisos de esta alerta
          icon: mdi:bell-ring
          tap_action:
            action: perform-action
            perform_action: alert.turn_on
            target:
              entity_id: alert.energy_waste_alert
