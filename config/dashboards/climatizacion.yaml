title: Climatizacion
views:
  - title: Climatizacion
    path: climatizacion
    icon: mdi:thermostat
    cards:
      - type: glance
        title: Estado ahora
        columns: 3
        state_color: true
        entities:
          - entity: climate.calefaccion
            name: Calefaccion
          - entity: sensor.confort_temperatura_media_casa
            name: Casa
          - entity: sensor.jardin_temperatura
            name: Exterior
          - entity: binary_sensor.climatizacion_planta_baja_aire_acondicionado_total_activo
            name: A/A PB
          - entity: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
            name: A/A 1P
          - entity: sensor.energy_tariff
            name: Tarifa

      - type: thermostat
        entity: climate.calefaccion
        name: Calefaccion

      - type: entities
        title: Control calefaccion
        show_header_toggle: false
        entities:
          - entity: input_boolean.calefaccion_temporada_activo
            name: Calefacción habilitada por temporada
          - entity: sensor.recibidor_temperatura
            name: Temperatura recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Objetivo termostato
          - entity: sensor.confort_temperatura_media_casa
            name: Media casa
          - entity: sensor.calefaccion_temperatura_media_casa_24h
            name: Media 24h
          - entity: sensor.confort_temperatura_media_planta_baja
            name: Media planta baja
          - entity: sensor.confort_temperatura_media_primera_planta
            name: Media primera planta
          - entity: input_boolean.confort_modo_dormir
            name: Modo dormir

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.confort_temperatura_media_casa
            name: Casa
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26
          - type: gauge
            entity: sensor.confort_temperatura_media_planta_baja
            name: PB
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26
          - type: gauge
            entity: sensor.confort_temperatura_media_primera_planta
            name: 1P
            min: 15
            max: 28
            severity:
              green: 20
              yellow: 24
              red: 26

      - type: history-graph
        title: Temperaturas 24h
        hours_to_show: 24
        entities:
          - entity: sensor.jardin_temperatura
            name: Exterior
          - entity: sensor.confort_temperatura_media_casa
            name: Casa
          - entity: sensor.confort_temperatura_media_planta_baja
            name: Planta baja
          - entity: sensor.confort_temperatura_media_primera_planta
            name: Primera planta
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Objetivo

      - type: entities
        title: Temperatura por estancia
        show_header_toggle: false
        entities:
          - entity: sensor.salon_temperatura
            name: Salon
          - entity: sensor.recibidor_temperatura
            name: Recibidor
          - entity: sensor.despacho_temperatura
            name: Despacho
          - entity: sensor.cocina_temperatura
            name: Cocina
          - entity: sensor.suite_temperatura
            name: Suite
          - entity: sensor.habitacion_carlos_temperatura
            name: Habitacion Carlos
          - entity: sensor.habitacion_coque_temperatura
            name: Habitacion Coque

      - type: entities
        title: Humedad y CO2
        show_header_toggle: false
        entities:
          - entity: sensor.jardin_humedad
            name: Humedad exterior
          - entity: sensor.salon_humedad
            name: Humedad salon
          - entity: sensor.suite_humedad
            name: Humedad suite
          - entity: sensor.habitacion_carlos_humedad
            name: Humedad Carlos
          - entity: sensor.habitacion_coque_humedad
            name: Humedad Coque
          - entity: sensor.salon_dioxido_carbono
            name: CO2 salon
          - entity: sensor.suite_dioxido_carbono
            name: CO2 suite
          - entity: sensor.habitacion_carlos_dioxido_carbono
            name: CO2 Carlos
          - entity: sensor.habitacion_coque_dioxido_carbono
            name: CO2 Coque

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.energy_power_house
            name: Vivienda
            min: 0
            max: 10000
            severity:
              green: 0
              yellow: 3000
              red: 6000
          - type: gauge
            entity: sensor.energy_power_photovoltaics
            name: Solar
            min: 0
            max: 8000
            severity:
              red: 0
              yellow: 1000
              green: 3000
          - type: gauge
            entity: sensor.fronius_solarnet_power_grid
            name: Red
            min: -8000
            max: 8000
            severity:
              green: -8000
              yellow: 0
              red: 3000

      - type: entities
        title: Consumo climatizacion
        show_header_toggle: false
        entities:
          - entity: binary_sensor.climatizacion_planta_baja_aire_acondicionado_total_activo
            name: A/A planta baja activo
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_potencia
            name: Potencia A/A planta baja
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_energia
            name: Energia A/A planta baja
          - entity: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
            name: A/A primera planta activo
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_potencia
            name: Potencia A/A primera planta
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_energia
            name: Energia A/A primera planta
          - entity: climate.calefaccion
            name: Calefaccion

      - type: history-graph
        title: Potencia climatizacion 24h
        hours_to_show: 24
        entities:
          - entity: sensor.climatizacion_planta_baja_aire_acondicionado_total_potencia
            name: A/A planta baja
          - entity: sensor.climatizacion_primera_planta_aire_acondicionado_potencia
            name: A/A primera planta
          - entity: sensor.energy_power_house
            name: Vivienda

      - type: history-graph
        title: Estado calefaccion 24h
        hours_to_show: 24
        entities:
          - entity: climate.calefaccion
            name: Calefaccion

      - type: entities
        title: Energia hoy
        show_header_toggle: false
        entities:
          - entity: sensor.energy_grid_today_punta
            name: Punta
          - entity: sensor.energy_grid_today_llana
            name: Llana
          - entity: sensor.energy_grid_today_valle
            name: Valle
          - entity: sensor.energy_price_buy
            name: Precio compra
          - entity: sensor.energy_price_sell
            name: Precio venta
          - entity: sensor.energy_net_balance_hour
            name: Balance neto ultima hora
          - entity: sensor.energy_net_balance
            name: Balance neto

      - type: entities
        title: Contexto exterior
        show_header_toggle: false
        entities:
          - entity: weather.confort_casa
            name: Tiempo
          - entity: sensor.jardin_temperatura
            name: Temperatura exterior
          - entity: sensor.jardin_humedad
            name: Humedad exterior
          - entity: sensor.jardin_viento_velocidad
            name: Viento
          - entity: sensor.jardin_lluvia
            name: Lluvia

  - title: Calefacción
    path: calefaccion
    icon: mdi:radiator
    cards:
      - type: glance
        title: Estado actual
        columns: 3
        state_color: true
        entities:
          - entity: climate.calefaccion
            name: Termostato
          - entity: sensor.recibidor_temperatura
            name: Recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Consigna Tado
          - entity: sensor.calefaccion_perfil_activo
            name: Perfil activo
          - entity: sensor.calefaccion_temperatura_objetivo
            name: Consigna HA
          - entity: sensor.confort_temperatura_media_casa
            name: Media casa
          - entity: sensor.calefaccion_temperatura_media_casa_24h
            name: Media 24 h
          - entity: binary_sensor.recibidor_termostato_activo
            name: Calentando (estimado)

      - type: thermostat
        entity: climate.calefaccion
        name: Calefacción

      - type: horizontal-stack
        cards:
          - type: button
            name: Automático
            icon: mdi:calendar-clock
            tap_action:
              action: perform-action
              perform_action: climate.set_hvac_mode
              target:
                entity_id: climate.calefaccion
              data:
                hvac_mode: auto
          - type: button
            name: Manual
            icon: mdi:hand-back-right
            tap_action:
              action: perform-action
              perform_action: climate.set_hvac_mode
              target:
                entity_id: climate.calefaccion
              data:
                hvac_mode: heat
          - type: button
            name: Apagado
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: climate.set_hvac_mode
              target:
                entity_id: climate.calefaccion
              data:
                hvac_mode: "off"

      - type: entities
        title: Control
        show_header_toggle: false
        entities:
          - type: attribute
            entity: climate.calefaccion
            attribute: modo_funcionamiento
            name: Modo de funcionamiento
          - entity: sensor.calefaccion_estado
            name: Estado del control
          - entity: sensor.calefaccion_perfil_activo
            name: Perfil activo
          - entity: input_number.calefaccion_temperatura_manual
            name: Consigna manual
          - entity: climate.recibidor_termostato
            name: Estado de Tado
            tap_action:
              action: more-info

      - type: entities
        title: Consignas de los perfiles
        show_header_toggle: false
        entities:
          - entity: input_number.calefaccion_temperatura_ausente
            name: Ausente
          - entity: input_number.calefaccion_temperatura_vacaciones
            name: Vacaciones
          - entity: input_number.calefaccion_temperatura_eco
            name: Eco
          - entity: input_number.calefaccion_temperatura_normal
            name: Normal
          - entity: input_number.calefaccion_temperatura_confort
            name: Confort
          - entity: input_number.calefaccion_temperatura_caliente
            name: Caliente

      - type: entities
        title: Programación
        show_header_toggle: false
        entities:
          - entity: schedule.calefaccion
            name: Horario semanal
            tap_action:
              action: more-info
          - entity: sensor.calefaccion_perfil_programado
            name: Perfil del horario
          - type: attribute
            entity: schedule.calefaccion
            attribute: next_event
            name: Próximo tramo
            format: relative

      - type: entities
        title: Temporada
        show_header_toggle: false
        entities:
          - entity: input_boolean.calefaccion_temporada_activo
            name: Calefacción habilitada
          - entity: sensor.calefaccion_temperatura_media_casa_24h
            name: Temperatura media de 24 h
          - entity: input_number.calefaccion_temporada_temperatura_activar
            name: Activar por debajo de
          - entity: input_number.calefaccion_temporada_temperatura_desactivar
            name: Desactivar por encima de

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.calefaccion_umbrales_validos
            state: "off"
        card:
          type: markdown
          content: "**Umbrales inválidos:** activar debe ser menor que desactivar."

      - type: glance
        title: Presencia y vacaciones
        columns: 3
        state_color: true
        entities:
          - entity: group.invitado_y_familia
            name: Familia e invitados
            tap_action:
              action: more-info
          - entity: binary_sensor.calefaccion_presencia
            name: Presencia calefacción
            tap_action:
              action: more-info
          - entity: switch.holiday
            name: Vacaciones
            tap_action:
              action: more-info

      - type: history-graph
        title: Temperatura y consigna · 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.recibidor_temperatura
            name: Recibidor
          - entity: sensor.recibidor_termostato_temperatura_objetivo
            name: Consigna termostato
          - entity: sensor.calefaccion_temperatura_objetivo
            name: Consigna HA
          - entity: sensor.confort_temperatura_media_casa
            name: Media casa

      - type: glance
        title: Avisos de puertas y ventanas
        columns: 2
        state_color: true
        entities:
          - entity: binary_sensor.energy_waste_alert
            name: Condición de aviso
          - entity: alert.energy_waste_alert
            name: Estado de la alerta
            tap_action:
              action: more-info

      - type: markdown
        title: Puertas y ventanas abiertas
        content: |-
          {% set monitored = label_entities('comprobacion_desperdicio_energetico') | expand | list %}
          {% set opened = monitored | selectattr('state', 'eq', 'on') | list %}
          {% if monitored | count == 0 %}
          Sin sensores configurados.
          {% elif opened | count == 0 %}
          Ninguna abierta.
          {% else %}
          {% for entity in opened %}
          {% set minutes = ((as_timestamp(now()) - as_timestamp(entity.last_changed)) / 60) | int %}
          - **{{ entity.name }}**: {{ minutes }} min abierta{{ ' · Más de 10 min' if as_timestamp(now()) - as_timestamp(entity.last_changed) > 600 else '' }}.
          {% endfor %}
          {% endif %}
          {% set missing = monitored | rejectattr('state', 'in', ['on', 'off']) | list %}
          {% if missing | count > 0 %}

          **Sin datos:** {{ missing | map(attribute='name') | join(', ') }}.
          {% endif %}


      - type: conditional
        conditions:
          - condition: state
            entity: alert.energy_waste_alert
            state: "on"
        card:
          type: button
          name: Silenciar aviso actual
          icon: mdi:bell-off
          tap_action:
            action: perform-action
            perform_action: alert.turn_off
            target:
              entity_id: alert.energy_waste_alert

      - type: conditional
        conditions:
          - condition: state
            entity: alert.energy_waste_alert
            state: "off"
        card:
          type: button
          name: Reactivar avisos de esta alerta
          icon: mdi:bell-ring
          tap_action:
            action: perform-action
            perform_action: alert.turn_on
            target:
              entity_id: alert.energy_waste_alert
