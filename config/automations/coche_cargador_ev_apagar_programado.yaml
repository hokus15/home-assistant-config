- id: coche_cargador_ev_apagar_programado
  alias: "Coche - Cargador EV - Apagar programado"
  trigger:
    - platform: time_pattern
      # Every minute
      minutes: "/1"
  # Execute automation when:
  #  - EV Charger is on
  #  - NOT (in 'Manual' mode OR in 'Manual con parada al acabar Valle' mode)
  #  - NOT ('Solar + Valle' mode AND in 'Valle' tariff)
  #  - Hourly net balance is too low to keep the pump on
  condition:
    condition: and
    conditions:
      - alias: "EV Charger is on"
        condition: state
        entity_id: switch.coladuria_cargador_ev
        state: "on"
      - condition: not
        conditions:
          - condition: or
            conditions:
              - alias: "In 'Manual' mode"
                condition: state
                entity_id: input_select.coladuria_cargador_ev_modo
                state: "Manual"
              - alias: "In 'Manual con parada al acabar Valle' mode"
                condition: state
                entity_id: input_select.coladuria_cargador_ev_modo
                state: "Manual con parada al acabar Valle"
          - condition: and
            conditions:
              - alias: "'Solar + Valle' mode"
                condition: state
                entity_id: input_select.coladuria_cargador_ev_modo
                state: "Solar + Valle"
              - alias: "'Valle' tariff"
                condition: state
                entity_id: select.energy_grid_today
                state: "Valle"
      - alias: "Hourly net balance is too low to keep the EV charger on"
        condition: state
        entity_id: binary_sensor.coladuria_cargador_ev_apagado_por_balance_neto_horario_insuficiente
        state: "off"
  action:
    - action: switch.turn_off
      entity_id: switch.coladuria_cargador_ev
