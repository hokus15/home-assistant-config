- id: coche_cargador_ev_apagar
  alias: "Coche - Cargador EV - Apagar"
  trigger:
    platform: state
    entity_id: select.energy_grid_today
    from: "Valle"
  # Execute automation when:
  #  - Not in manual mode.
  #  - EV Charger is on
  condition:
    condition: and
    conditions:
      - condition: not
        conditions:
          - alias: "Not in manual mode"
            condition: state
            entity_id: input_select.coladuria_cargador_ev_modo
            state: "Manual"
      - alias: "EV Charger is on"
        condition: state
        entity_id: switch.coladuria_cargador_ev
        state: "on"
  action:
    - action: switch.turn_off
      entity_id: switch.coladuria_cargador_ev
