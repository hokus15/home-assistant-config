# Telegram bot that executes a service from a callback with the format <service>#<entity_id>. i.e.: script.turn_on#script.fence_close
- id: 'telegram_callback_bot'
  alias: 'Telegram - Gestión de callbacks del bot'
  trigger:
    - platform: event
      event_type: telegram_callback
  condition:
    # Run only in case it has a # in the event data
    condition: template
    value_template: '{{ trigger.event.data.data.find("#") != -1 }}'
  action:
    # Answer callback
    - action: telegram_bot.answer_callback_query
      data_template:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Respuesta recibida!'
        show_alert: false
    # Remove inline keyboard from original message.
    - action: telegram_bot.edit_replymarkup
      data_template:
             message_id: '{{ trigger.event.data.message.message_id }}'
             chat_id: '{{ trigger.event.data.chat_id }}'
             inline_keyboard: []
    # Camera motion controls use a compact, allow-listed callback token because
    # Telegram callback_data is limited to 64 bytes.
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.event.data.data.startswith('/camara_movimiento_desactivar#') }}
          sequence:
            - variables:
                cameras: !include ../seguridad/camaras.yaml
                camera_token: "{{ trigger.event.data.data.split('#', 1)[1] }}"
            - condition: template
              value_template: "{{ camera_token in cameras }}"
            - action: script.seguridad_controlar
              data:
                command: exclude
                detector: "{{ cameras[camera_token].camera_entity }}"
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.event.data.data in [
                     '/alarm_control_panel.alarm_arm_away#alarm_control_panel.home',
                     '/alarm_control_panel.alarm_arm_night#alarm_control_panel.home',
                     '/alarm_control_panel.alarm_disarm#alarm_control_panel.home'] }}
          sequence:
            - action: script.seguridad_controlar
              data:
                command: >-
                  {{ 'arm_night' if 'alarm_arm_night' in trigger.event.data.data else
                     'arm_away' if 'alarm_arm_away' in trigger.event.data.data else 'disarm' }}
      default:
        # Execute callbacks with the established <service>#<entity_id> format.
        # Invalid services or entity IDs are ignored by Home Assistant.
        - action: >
            {{ trigger.event.data.data[1:trigger.event.data.data.find("#")] }}
          data_template:
            entity_id: '{{ trigger.event.data.data[trigger.event.data.data.find("#") + 1:] }}'
