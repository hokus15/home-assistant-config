- id: "person_zone_children_enter_leave_zone"
  alias: "Person - Zone - Children enter or leave zone"
  trigger:
    # Abu's home
    - platform: zone
      zone: zone.casa_abu
      event: enter
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque
    - platform: zone
      zone: zone.casa_abu
      event: leave
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque

    # Avi and Senyoravi's home
    - platform: zone
      zone: zone.casa_avi_y_senyoravi
      event: enter
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque
    - platform: zone
      zone: zone.casa_avi_y_senyoravi
      event: leave
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque

    # Near home
    - platform: zone
      zone: zone.casa_cerca
      event: enter
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque
    - platform: zone
      zone: zone.casa_cerca
      event: leave
      enabled: false
      entity_id:
        - person.carlos
        - person.coque

    # School
    - platform: zone
      zone: zone.colegio
      event: enter
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque
    - platform: zone
      zone: zone.colegio
      event: leave
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque

    # Home
    - platform: zone
      zone: zone.home
      event: enter
      enabled: false
      entity_id:
        - person.carlos
        - person.coque
    - platform: zone
      zone: zone.home
      event: leave
      # enabled: false
      entity_id:
        - person.carlos
        - person.coque

  action:
    - variables:
        person: "{{ trigger.to_state.attributes.friendly_name }}"
        event: "{{ 'ha salido de' if trigger.event == 'leave' else 'ha llegado a' }}"
        zone: "{{ trigger.zone.attributes.friendly_name }}"

    - action: notify.send_message
      data:
        entity_id: notify.telegram_family_group
        message: "{{person}} {{event}} {{zone}}"
