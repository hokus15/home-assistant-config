- id: car_notification_iotconnect_monitor
  alias: "Car - Notification - IOTConnect monitor"
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.car_ioniq_iotconnect_monitor_alert
      to: "on"
      for: "00:03:00"
      id: problema
    - trigger: state
      entity_id: binary_sensor.car_ioniq_iotconnect_monitor_alert
      to: "off"
      id: resuelto
  actions:
    - choose:
        - conditions: "{{ trigger.id == 'problema' }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.car_ioniq_iotconnect_monitor_notificado
            - repeat:
                while:
                  - condition: state
                    entity_id: binary_sensor.car_ioniq_iotconnect_monitor_alert
                    state: "on"
                sequence:
                  - action: notify.mobile_app_hokusphone
                    data:
                      title: "IOTConnect"
                      message: "IOTConnect está parado."
                      data:
                        tag: iotconnect-app
                        car_ui: true
                        notification_icon: mdi:car-off
                        color: "#F44336"
                        channel: Ioniq
                        importance: low
                  - delay: "00:15:00"
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.id == 'resuelto'
                   and is_state('input_boolean.car_ioniq_iotconnect_monitor_notificado', 'on') }}
          sequence:
            - choose:
                - conditions: >-
                    {{ is_state('binary_sensor.car_ioniq_iotconnect_monitor', 'on')
                       and is_state('binary_sensor.hokusphone_in_car_ioniq', 'on') }}
                  sequence:
                    - action: notify.mobile_app_hokusphone
                      data:
                        title: "IOTConnect"
                        message: "IOTConnect vuelve a publicar datos."
                        data:
                          tag: iotconnect-app
                          car_ui: true
                          notification_icon: mdi:car-connected
                          color: "#4CAF50"
                          channel: Ioniq
                          importance: low
              default:
                - action: notify.mobile_app_hokusphone
                  data:
                    message: clear_notification
                    data:
                      tag: iotconnect-app
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.car_ioniq_iotconnect_monitor_notificado

