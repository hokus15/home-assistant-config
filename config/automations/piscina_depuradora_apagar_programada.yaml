- id: "piscina_depuradora_apagar_programada"
  alias: "Piscina - Depuradora - Apagar programada"
  trigger:
    - platform: time_pattern
      # Every minute
      minutes: "/1"
  # Execute automation when:
  #  - Pump is on
  #  - NOT in manual mode.
  #  - There is no remaining filtering time, regardless of tariff
  #    OR hourly net balance is too low outside 'Solar + Valle' in 'Valle' tariff.
  condition:
    condition: and
    conditions:
      - alias: "Pump is on"
        condition: state
        entity_id: switch.piscina_depuradora
        state: "on"
      - condition: not
        conditions:
          - alias: "Not in manual mode"
            condition: state
            entity_id: input_select.piscina_depuradora_modo
            state: "Manual"
      - condition: or
        conditions:
          - alias: "There is no remaining filtering time"
            condition: state
            entity_id: binary_sensor.piscina_filtrado_pendiente
            state: "off"
          - condition: and
            conditions:
              - alias: "Hourly net balance is too low to keep the pump on"
                condition: state
                entity_id: binary_sensor.piscina_depuradora_balance_neto_horario_suficiente_para_mantenerse_encendida
                state: "off"
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - alias: "'Solar + Valle' mode"
                        condition: state
                        entity_id: input_select.piscina_depuradora_modo
                        state: "Solar + Valle"
                      - alias: "'Valle' tariff"
                        condition: state
                        entity_id: select.energy_grid_today
                        state: "Valle"

  action:
    - action: switch.turn_off
      entity_id: switch.piscina_depuradora
