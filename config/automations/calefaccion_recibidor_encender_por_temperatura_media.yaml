# Update seasonal permission independently of occupancy and holiday mode.
- id: calefaccion_recibidor_encender_por_temperatura_media
  alias: "Calefacción - Recibidor - Encender por temperatura media"
  mode: single
  triggers:
    # Template crossings also re-arm when the editable boundary changes.
    - trigger: template
      id: temperature_threshold
      value_template: >-
        {{ is_number(states('sensor.calefaccion_temperatura_media_casa_24h'))
           and is_number(states('input_number.calefaccion_temporada_temperatura_activar'))
           and states('sensor.calefaccion_temperatura_media_casa_24h') | float(0)
               < states('input_number.calefaccion_temporada_temperatura_activar') | float(0) }}
    - trigger: state
      entity_id:
        - input_number.calefaccion_temporada_temperatura_activar
        - input_number.calefaccion_temporada_temperatura_desactivar
      to: null
    - trigger: homeassistant
      event: start
    - trigger: template
      id: recovery
      value_template: >-
        {{ has_value('sensor.calefaccion_temperatura_media_casa_24h')
           and has_value('input_boolean.calefaccion_temporada_activo')
           and is_state('binary_sensor.calefaccion_umbrales_validos', 'on') }}
  conditions:
    # Validate current helper values too, before the derived sensor catches up.
    - condition: template
      value_template: >-
        {{ is_number(states('input_number.calefaccion_temporada_temperatura_activar'))
           and is_number(states('input_number.calefaccion_temporada_temperatura_desactivar'))
           and states('input_number.calefaccion_temporada_temperatura_activar') | float(0)
               < states('input_number.calefaccion_temporada_temperatura_desactivar') | float(0) }}
    - condition: state
      entity_id: binary_sensor.calefaccion_umbrales_validos
      state: "on"
    - condition: numeric_state
      entity_id: sensor.calefaccion_temperatura_media_casa_24h
      below: input_number.calefaccion_temporada_temperatura_activar
    - condition: state
      entity_id: input_boolean.calefaccion_temporada_activo
      state: "off"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.calefaccion_temporada_activo
    - action: logbook.log
      data:
        name: Calefacción
        message: "Habilitada porque la temperatura media de casa en las últimas 24 horas está por debajo de {{ states('input_number.calefaccion_temporada_temperatura_activar') }} °C."
        entity_id: input_boolean.calefaccion_temporada_activo
    - action: notify.send_message
      target:
        entity_id: notify.telegram_hokusphone
      data:
        message: "⛄ Como veo que empieza el frío, he activado la calefacción. Se encenderá cuando corresponda según el modo y las temperaturas que tengas configurados."
        data:
          inline_keyboard:
            - "Deshabilitar calefacción:/input_boolean.turn_off#input_boolean.calefaccion_temporada_activo"
