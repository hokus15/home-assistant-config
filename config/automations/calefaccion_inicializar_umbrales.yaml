# Apply defaults only on first installation, preserving later manual settings.
- id: calefaccion_inicializar_umbrales
  alias: "Calefacción - Inicializar umbrales de temporada"
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: template
      value_template: >-
        {{ has_value('input_boolean.calefaccion_umbrales_inicializado')
           and has_value('input_number.calefaccion_temporada_temperatura_activar')
           and has_value('input_number.calefaccion_temporada_temperatura_desactivar') }}
  conditions:
    - condition: state
      entity_id: input_boolean.calefaccion_umbrales_inicializado
      state: "off"
    - condition: template
      value_template: >-
        {{ has_value('input_number.calefaccion_temporada_temperatura_activar')
           and has_value('input_number.calefaccion_temporada_temperatura_desactivar') }}
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.calefaccion_temporada_temperatura_activar
      data:
        value: 18.5
    - action: input_number.set_value
      target:
        entity_id: input_number.calefaccion_temporada_temperatura_desactivar
      data:
        value: 20
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.calefaccion_umbrales_inicializado
