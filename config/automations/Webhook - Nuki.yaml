- id: "webhook_nuki_callback"
  alias: "Webhook - Nuki - Callback"
  trigger:
    - platform: webhook
      webhook_id: nuki-webhook
      allowed_methods:
        - POST
      local_only: false
  action:
    - action: mqtt.publish
      data_template:
        topic: "home/lock/entrada"
        retain: true
        payload: "{{ trigger.json|to_json }}"
        qos: 0
