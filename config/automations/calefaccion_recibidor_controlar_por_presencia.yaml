# The automatic writer of thermostat mode: season + presence + holiday.
- id: calefaccion_recibidor_controlar_por_presencia
  alias: "Calefacción - Recibidor - Controlar por presencia"
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.calefaccion_presencia
        - input_boolean.calefaccion_temporada_activo
        - switch.holiday
        - binary_sensor.calefaccion_umbrales_validos
        - input_number.calefaccion_temporada_temperatura_activar
        - input_number.calefaccion_temporada_temperatura_desactivar
      to: null
    - trigger: homeassistant
      event: start
    # Availability recovery only: manual heat/off changes must not retrigger.
    - trigger: template
      value_template: >-
        {{ states('climate.recibidor_termostato') in ['heat', 'off'] }}
  conditions:
    # Validate current helper values too, before the derived sensor catches up.
    - condition: template
      value_template: >-
        {{ is_state('input_boolean.calefaccion_umbrales_inicializado', 'on')
           and is_number(states('input_number.calefaccion_temporada_temperatura_activar'))
           and is_number(states('input_number.calefaccion_temporada_temperatura_desactivar'))
           and states('input_number.calefaccion_temporada_temperatura_activar') | float(0)
               < states('input_number.calefaccion_temporada_temperatura_desactivar') | float(0) }}
    - condition: state
      entity_id: binary_sensor.calefaccion_umbrales_validos
      state: "on"
    # Unknown holiday/presence states are not permission to operate.
    - condition: state
      entity_id: switch.holiday
      state: "off"
    - condition: template
      value_template: >-
        {{ states('group.invitado_y_familia') in ['home', 'not_home']
           and states('binary_sensor.calefaccion_presencia') in ['on', 'off']
           and states('input_boolean.calefaccion_temporada_activo') in ['on', 'off']
           and states('climate.recibidor_termostato') in ['heat', 'off'] }}
  actions:
    - variables:
        # At startup the restored permission may precede the temperature update.
        # Never briefly enable heating with an already-known summer temperature.
        desired_mode: >-
          {{ 'heat' if is_state('input_boolean.calefaccion_temporada_activo', 'on')
             and is_state('binary_sensor.calefaccion_presencia', 'on')
             and not (is_number(states('sensor.home_temperature_stats'))
                      and states('sensor.home_temperature_stats') | float(0)
                          > states('input_number.calefaccion_temporada_temperatura_desactivar') | float(0))
             else 'off' }}
    - condition: template
      value_template: "{{ not is_state('climate.recibidor_termostato', desired_mode) }}"
    # Tado is configured to resume its schedule one minute after selecting heat.
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.recibidor_termostato
      data:
        hvac_mode: "{{ desired_mode }}"
    - wait_template: "{{ is_state('climate.recibidor_termostato', desired_mode) }}"
      timeout: "00:00:30"
      continue_on_timeout: false
    - action: logbook.log
      data:
        name: Calefacción
        message: >-
          {{ 'habilitada' if desired_mode == 'heat' else 'apagada' }} por control
          de presencia (presencia efectiva: {{ states('binary_sensor.calefaccion_presencia') }},
          permiso de temporada: {{ states('input_boolean.calefaccion_temporada_activo') }}).
        entity_id: climate.recibidor_termostato
        domain: climate
