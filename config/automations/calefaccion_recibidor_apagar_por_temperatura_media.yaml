# Update seasonal permission independently of occupancy and holiday mode.
- id: calefaccion_recibidor_apagar_por_temperatura_media
  alias: "Calefacción - Recibidor - Apagar por temperatura media"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.home_temperature_stats
      above: 20
    - trigger: homeassistant
      event: start
    - trigger: template
      value_template: >-
        {{ has_value('sensor.home_temperature_stats')
           and has_value('input_boolean.calefaccion_temporada_activo') }}
  conditions:
    - condition: numeric_state
      entity_id: sensor.home_temperature_stats
      above: 20
    - condition: state
      entity_id: input_boolean.calefaccion_temporada_activo
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.calefaccion_temporada_activo
    - action: logbook.log
      data:
        name: Calefacción
        message: "permiso de temporada desactivado por temperatura media superior a 20 °C"
        entity_id: input_boolean.calefaccion_temporada_activo
    - action: notify.send_message
      target:
        entity_id: notify.telegram_hokusphone
      data:
        message: "🌞 He desactivado el permiso de calefacción: la temperatura media de casa es superior a 20 °C. El termostato se controla según presencia y no se modifica en vacaciones."
        data:
          inline_keyboard:
            - "Habilitar calefacción:/input_boolean.turn_on#input_boolean.calefaccion_temporada_activo"
