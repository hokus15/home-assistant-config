- id: "climatizacion_suite_aire_acondicionado_inicio_actividad"
  alias: "Climatizacion - Suite A/A - Inicio actividad"
  trigger:
    - platform: state
      entity_id: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.suite_aire_acondicionado_prueba_activa
      state: "on"
  action:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.suite_aire_acondicionado_inicio_actividad
      data:
        timestamp: "{{ as_timestamp(now()) }}"

- id: "climatizacion_suite_aire_acondicionado_inicio_enfriamiento"
  alias: "Climatizacion - Suite A/A - Inicio enfriamiento"
  trigger:
    - platform: state
      entity_id: binary_sensor.suite_aire_acondicionado_enfriando
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.suite_aire_acondicionado_prueba_activa
      state: "on"
    - condition: template
      value_template: "{{ is_number(states('sensor.suite_temperature')) }}"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.suite_aire_acondicionado_inicio_enfriamiento
      data:
        timestamp: "{{ as_timestamp(now()) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_temperatura_inicio_enfriamiento
      data:
        value: "{{ states('sensor.suite_temperature') | float(0) }}"

- id: "climatizacion_suite_aire_acondicionado_inicio_parada_sin_consigna"
  alias: "Climatizacion - Suite A/A - Inicio sin enfriar sobre consigna"
  trigger:
    - platform: state
      entity_id: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.suite_aire_acondicionado_prueba_activa
      state: "on"
    - condition: template
      value_template: "{{ is_number(states('sensor.suite_temperature')) }}"
  action:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.suite_aire_acondicionado_fin_enfriamiento
      data:
        timestamp: "{{ as_timestamp(now()) }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.suite_aire_acondicionado_inicio_parada
      data:
        timestamp: "{{ as_timestamp(now()) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_temperatura_fin_enfriamiento
      data:
        value: "{{ states('sensor.suite_temperature') | float(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_temperatura_inicio_parada
      data:
        value: "{{ states('sensor.suite_temperature') | float(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_potencia_inicio_parada
      data:
        value: "{{ states('sensor.climatizacion_primera_planta_aire_acondicionado_potencia') | float(0) | round(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_potencia_media_30min_inicio_parada
      data:
        value: >-
          {% set media = states('sensor.suite_aire_acondicionado_potencia_media_30min') %}
          {{ (media if is_number(media) else states('sensor.climatizacion_primera_planta_aire_acondicionado_potencia')) | float(0) | round(0) }}
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo
      data:
        value: >-
          {% set inicio = as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_actividad'), 0) %}
          {{ ((as_timestamp(now()) - inicio) / 60) | round(0) if inicio > 0 else 0 }}
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_tiempo_enfriamiento_ultimo
      data:
        value: >-
          {% set inicio = as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_enfriamiento'), 0) %}
          {% set minutos = ((as_timestamp(now()) - inicio) / 60) | round(0) if inicio > 0 else 0 %}
          {{ minutos if 0 <= minutos <= 720 else 720 if minutos > 720 else 0 }}
    - action: counter.increment
      target:
        entity_id: counter.suite_aire_acondicionado_fallos_nocturnos
    - action: logbook.log
      data:
        name: "Diagnostico A/A suite: fallo detectado"
        entity_id: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
        message: >-
          Suite {{ states('sensor.suite_temperature') }} °C (consigna {{ states('input_number.suite_aire_acondicionado_temperatura_consigna') }} °C, +{{ states('sensor.suite_aire_acondicionado_diferencia_consigna') }} °C); tiempo desde actividad A/A {{ states('input_number.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo') }} min, desde enfriamiento Suite {{ states('input_number.suite_aire_acondicionado_tiempo_enfriamiento_ultimo') }} min. Potencia A/A 1P {{ states('sensor.climatizacion_primera_planta_aire_acondicionado_potencia') }} W; media 30min {{ states('input_number.suite_aire_acondicionado_potencia_media_30min_inicio_parada') }} W. Splits previstos: Suite {{ states('input_boolean.suite_aire_acondicionado_previsto') }}, Carlos {{ states('input_boolean.habitacion_carlos_aire_acondicionado_previsto') }}, Coque {{ states('input_boolean.habitacion_coque_aire_acondicionado_previsto') }}. Otros splits previstos inferidos enfriando: {{ states('sensor.climatizacion_primera_planta_aire_acondicionado_otros_splits_enfriando') }} (Carlos: {{ states('binary_sensor.habitacion_carlos_aire_acondicionado_enfriando') }}, Coque: {{ states('binary_sensor.habitacion_coque_aire_acondicionado_enfriando') }}). T Carlos/Coque: {{ states('sensor.habitacion_carlos_temperature') }}/{{ states('sensor.habitacion_coque_temperature') }} °C; exterior {{ states('sensor.exterior_temperature') }} °C, {{ states('sensor.exterior_humidity') }} %. Ventana Suite: {{ states('binary_sensor.suite_sensor_ventana') }}.

- id: "climatizacion_suite_aire_acondicionado_recuperacion"
  alias: "Climatizacion - Suite A/A - Recuperacion"
  trigger:
    - platform: state
      entity_id: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
      to: "off"
  condition:
    - condition: state
      entity_id: input_boolean.suite_aire_acondicionado_prueba_activa
      state: "on"
    - condition: state
      entity_id: binary_sensor.suite_aire_acondicionado_enfriando
      state: "on"
    - condition: template
      value_template: "{{ is_number(states('sensor.suite_temperature')) }}"
  action:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.suite_aire_acondicionado_fin_parada
      data:
        timestamp: "{{ as_timestamp(now()) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.suite_aire_acondicionado_tiempo_parada_ultimo
      data:
        value: >-
          {% set inicio = as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_parada'), 0) %}
          {{ ((as_timestamp(now()) - inicio) / 60) | round(0) if inicio > 0 else 0 }}
    - action: logbook.log
      data:
        name: "Diagnostico A/A suite: recuperacion"
        entity_id: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
        message: >-
          Tras {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.suite_aire_acondicionado_inicio_parada'), 0)) / 60) | round(0) }} min sin enfriar sobre consigna: Suite {{ states('sensor.suite_temperature') }} °C; potencia A/A 1P {{ states('sensor.climatizacion_primera_planta_aire_acondicionado_potencia') }} W; otros splits previstos inferidos enfriando {{ states('sensor.climatizacion_primera_planta_aire_acondicionado_otros_splits_enfriando') }}.

- id: "climatizacion_suite_aire_acondicionado_programar_prueba"
  alias: "Climatizacion - Suite A/A - Programar prueba"
  trigger:
    - platform: time
      at: "22:00:00"
      id: activar
    - platform: time
      at: "10:00:00"
      id: desactivar
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: activar
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.suite_aire_acondicionado_prueba_activa
            - action: counter.reset
              target:
                entity_id: counter.suite_aire_acondicionado_fallos_nocturnos
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno
            - if:
                - condition: state
                  entity_id: binary_sensor.climatizacion_primera_planta_aire_acondicionado_activo
                  state: "on"
              then:
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.suite_aire_acondicionado_inicio_actividad
                  data:
                    timestamp: "{{ as_timestamp(now()) }}"
            - if:
                - condition: state
                  entity_id: binary_sensor.suite_aire_acondicionado_enfriando
                  state: "on"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.suite_aire_acondicionado_inicio_enfriamiento
                  data:
                    timestamp: "{{ as_timestamp(now()) }}"
      default:
        - action: logbook.log
          data:
            name: "Diagnostico A/A suite: resumen nocturno"
            entity_id: binary_sensor.suite_aire_acondicionado_parado_sin_consigna
            message: >-
              Ventana de prueba finalizada. Suite enfriando detectada: {{ states('input_boolean.suite_aire_acondicionado_enfriamiento_detectado_nocturno') }}; fallos detectados: {{ states('counter.suite_aire_acondicionado_fallos_nocturnos') }}. Ultimo inicio actividad A/A: {{ states('input_datetime.suite_aire_acondicionado_inicio_actividad') }}; ultimo inicio de enfriamiento: {{ states('input_datetime.suite_aire_acondicionado_inicio_enfriamiento') }}; ultimo inicio de fallo: {{ states('input_datetime.suite_aire_acondicionado_inicio_parada') }}; tiempo actividad hasta fallo: {{ states('sensor.suite_aire_acondicionado_tiempo_actividad_hasta_fallo_ultimo') }} min.
        - action: input_boolean.turn_off
          target:
            entity_id:
              - input_boolean.suite_aire_acondicionado_prueba_activa
              - input_boolean.suite_aire_acondicionado_previsto
              - input_boolean.habitacion_carlos_aire_acondicionado_previsto
              - input_boolean.habitacion_coque_aire_acondicionado_previsto
