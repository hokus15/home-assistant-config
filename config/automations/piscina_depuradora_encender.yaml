- id: "piscina_depuradora_encender"
  alias: "Piscina - Depuradora - Encender"
  trigger:
    # When generating enough energy
    - platform: state
      entity_id: binary_sensor.piscina_depuradora_encendido_por_excedente_energetico_sobre_umbral
      to: "on"
    # When hourly net balance is enough to turn on the pump
    - platform: state
      entity_id: binary_sensor.piscina_depuradora_encendido_por_balance_neto_horario_suficiente
      to: "on"
    - platform: state
      entity_id: binary_sensor.piscina_depuradora_balance_neto_horario_suficiente_para_mantenerse_encendida
      to: "on"

    - platform: state
      entity_id: binary_sensor.piscina_filtrado_pendiente
      to: "on"
  # Execute automation when:
  #  - 'Solar' OR 'Solar + Valle' modes
  #  - Generating enough enery OR hourly net balance is enough
  #  - Hourly net balance is enough to keep the pump on
  #  - Still has remaining filtering time
  #  - Pump is off
  condition:
    condition: and
    conditions:
      - alias: "'Solar' or 'Solar + Valle' modes"
        condition: or
        conditions:
          - alias: "Solar mode"
            condition: state
            entity_id: input_select.piscina_depuradora_modo
            state: "Solar"
          - alias: "Solar + Valle mode"
            condition: state
            entity_id: input_select.piscina_depuradora_modo
            state: "Solar + Valle"
      - alias: "Generating enough enery or hourly net balance is enough"
        condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.piscina_depuradora_encendido_por_excedente_energetico_sobre_umbral
            state: "on"
          - condition: state
            entity_id: binary_sensor.piscina_depuradora_encendido_por_balance_neto_horario_suficiente
            state: "on"
      - alias: "Hourly net balance is enough to keep the pump on"
        condition: state
        entity_id: binary_sensor.piscina_depuradora_balance_neto_horario_suficiente_para_mantenerse_encendida
        state: "on"
      - alias: "Still has remaining filtering time"
        condition: state
        entity_id: binary_sensor.piscina_filtrado_pendiente
        state: "on"
      - alias: "Pump is off"
        condition: state
        entity_id: switch.piscina_depuradora
        state: "off"
  action:
    # Check runtime at execution instead of relying only on the derived sensor.
    - alias: "Confirm remaining filtering time before turning on"
      condition: template
      value_template: >-
        {% set elapsed = states('sensor.piscina_depuradora_tiempo_funcionamiento_hoy') %}
        {% set target = states('sensor.piscina_tiempo_filtrado') %}
        {{ is_number(elapsed) and is_number(target)
           and elapsed | float(0) < target | float(0) }}
    - action: switch.turn_on
      entity_id: switch.piscina_depuradora
