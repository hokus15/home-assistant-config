- id: "person_zone_geni_enters_home"
  alias: "Person - Zone - Geni enters home"
  trigger:
    - platform: zone
      entity_id: person.geni
      zone: zone.home
      event: enter
  condition:
    condition: and
    conditions:
      # Fence is closed
      - condition: state
        entity_id: cover.entrada_barrera
        state: "closed"
      # geniphone is in car QASHQAI (see binary_sensor.geniphone_in_car_qashqai in phones.yaml)
      - condition: state
        entity_id: binary_sensor.geniphone_in_car_qashqai
        state: "on"
  action:
    - action: cover.open_cover
      entity_id: cover.entrada_barrera
    - delay:
        seconds: 5
    - action: notify.send_message
      data:
        entity_id: notify.telegram_hokusphone
        message: "🚪 Barrera abierta automáticamente para Geni"
        data:
          inline_keyboard:
            - "Cerrar:/switch.turn_on#switch.entrada_barrera"
